name: Finalize Core 4.4.1 repin once

on:
  push:
    branches: [repin-core-v4.4.1]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'chore: repin Safe Core 4.4.1 and prepare 4.1.1' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repin-core-v4.4.1
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Repin Core and patch product version
        shell: bash
        run: |
          set -euo pipefail
          old='c59a036cdb0b5839fe0e794031d38fd274bc116b'
          core='0caabb91ad7f2bcedb9f3e5ac50ba4c68a315d46'
          git -C src/codex-safe-core fetch --quiet origin "$core"
          git -C src/codex-safe-core checkout --quiet "$core"
          git add src/codex-safe-core
          node <<'NODE'
          const fs=require('fs');
          for(const name of ['package.json','package-lock.json']){
            const x=JSON.parse(fs.readFileSync(name,'utf8'));
            x.version='4.1.1';
            if(x.packages?.[''])x.packages[''].version='4.1.1';
            fs.writeFileSync(name,JSON.stringify(x,null,2)+'\n');
          }
          NODE
          git show origin/main:package.json | sed 's/"version": "4.1.0"/"version": "4.1.1"/' > package.json
          python3 <<'PY'
          from pathlib import Path
          old='c59a036cdb0b5839fe0e794031d38fd274bc116b'
          new='0caabb91ad7f2bcedb9f3e5ac50ba4c68a315d46'
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.parts[:2]==('src','codex-safe-core') or p.parts[:2]==('.github','workflows'):
                  continue
              if p.suffix.lower() not in {'.json','.js','.md','.yml','.yaml'}:
                  continue
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              if old in s: p.write_text(s.replace(old,new))
          p=Path('CHANGELOG.md'); s=p.read_text()
          if '\n## 4.1.1 - 2026-08-27\n' not in s:
              entry='''\n## 4.1.1 - 2026-08-27\n\n- Repin the exact Safe Core 4.4.1 immutable-release publication patch; Review runtime, Quality Platform and protocol semantics are unchanged.\n- Publish new VSIX/SBOM/checksum assets under repository-level immutable Releases and verify the published assets in CI.\n'''
              s=s.replace('## Unreleased\n','## Unreleased\n'+entry,1)
              p.write_text(s)
          PY
      - name: Install Extension Host dependencies
        run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - name: Run full product CI
        run: xvfb-run -a npm run ci
      - name: Push validated non-workflow state
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .github/workflows/repin-core-v4.4.1-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: repin Safe Core 4.4.1 and prepare 4.1.1'
          git push origin HEAD:repin-core-v4.4.1
