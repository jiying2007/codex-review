name: Temporary Review 4.7.5 Finalizer

on:
  push:
    branches: [feat/model-routing-v1]

permissions:
  contents: write

concurrency:
  group: tmp-review-475-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/model-routing-v1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Finalize ordinary Review 4.7.5 files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function replace(file,from,to){let s=fs.readFileSync(file,'utf8');if(!s.includes(from))throw new Error(`${file}: expected text not found`);s=s.replace(from,to);fs.writeFileSync(file,s);}
          const coreSha='e962826ee6556fd8ffa74ab1994bf43d62826f10';
          const oldSha='25467922eeebffa93b7c820f2ffa7590c1625381';
          replace('extension.js','async function reviewStaged(commandArgs = []) {','async function reviewStaged(commandArgs = [], { forceFresh = false } = {}) {');
          replace('extension.js','        const replayDecision = replayWindow.tryReplay(repoRoot, reviewSubjectKey);','        if (forceFresh) { replayWindow.clearSubject(repoRoot, reviewSubjectKey); log(`fresh blind review: bypassing result replay for ${reviewSubjectKey.slice(0,12)}`); }\n        const replayDecision = replayWindow.tryReplay(repoRoot, reviewSubjectKey);');
          const marker="    vscode.commands.registerCommand('safeCodexReview.clearReview', clearReview),";
          let ext=fs.readFileSync('extension.js','utf8');
          if(!ext.includes("vscode.commands.registerCommand('safeCodexReview.reviewFresh'")){
            if(!ext.includes(marker))throw new Error('review command registration marker missing');
            ext=ext.replace(marker,"    vscode.commands.registerCommand('safeCodexReview.reviewFresh', async (...args) => {\n      try { await reviewStaged(args, { forceFresh: true }); }\n      catch (error) {\n        log(`fresh review failed: code=${error?.code || 'unknown'}`);\n        if (error?.code !== 'ECANCELLED') vscode.window.showErrorMessage(t('Codex Review Safe failed: {0}', friendlyError(error)));\n      }\n    }),\n"+marker);
            fs.writeFileSync('extension.js',ext);
          }
          let ch=fs.readFileSync('CHANGELOG.md','utf8');
          if(!ch.startsWith('## 4.7.5')) ch=`## 4.7.5 - 2026-09-04\n\n- Repin to immutable Codex Safe Core 4.15.0 and adopt Model Routing Contract v1 while preserving Safe Contract v2, Policy Schema v4 and Review Receipt v5.\n- Separate Review mode (fast/balanced/deep) from engineering Profile Pack, expose bounded fast-model hypothesis routing and whole-review token/evidence budgets, and keep verification on the primary model.\n- Add explicit Fresh Blind Review that bypasses result replay without weakening the existing replay/convergence evidence rules.\n- Package Core streaming JSONL and privacy-safe token-calibration primitives; budget omissions remain explicit coverage gaps and Change authority is unaffected.\n\n${ch}`;
          fs.writeFileSync('CHANGELOG.md',ch);
          for(const file of ['scripts/verify-manifest.js','scripts/release.test.js','.codex-safe.example.json']){
            if(!fs.existsSync(file))continue;
            let s=fs.readFileSync(file,'utf8');
            s=s.split(oldSha).join(coreSha).split('4.14.4').join('4.15.0').split('4.7.4').join('4.7.5');
            fs.writeFileSync(file,s);
          }
          for(const file of ['README.md','README.zh-CN.md','SECURITY.md','ARCHITECTURE.md','VERIFY_RELEASE.md']){
            if(!fs.existsSync(file))continue;
            let s=fs.readFileSync(file,'utf8');
            s=s.split(oldSha).join(coreSha).split('Core 4.14.4').join('Core 4.15.0').split('v4.14.4').join('v4.15.0');
            fs.writeFileSync(file,s);
          }
          NODE
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(review): finalize 4.7.5 ordinary release files'
          git push origin HEAD:feat/model-routing-v1
