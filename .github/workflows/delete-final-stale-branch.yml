name: Delete final stale branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-final-stale-branch.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Delete stale branch
        shell: bash
        run: |
          set -euo pipefail
          branch='chore/safe-core-main-source'
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git push origin --delete "${branch}"
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Branch still exists: ${branch}" >&2
            exit 1
          fi
          echo "Deleted ${branch}."
