name: Delete obsolete branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Delete obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'cleanup/final-transition-removal'
            'codex/adopt-safe-core-v1'
            'codex/remove-transition-residue'
            'feat/review-hardening-20260821'
            'refactor/remove-transition-residue'
            'refactor/remove-transition-residue-2'
            'refactor/split-review-modules'
            'test/package-safe-core-runtime'
            'test/workspace-trust-cli'
            'tmp-placeholder'
            'ops/delete-obsolete-branches'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          remaining=$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -v '^main$' || true)
          if [[ -n "$remaining" ]]; then
            echo 'Unexpected remote branches remain:' >&2
            echo "$remaining" >&2
            exit 1
          fi
          echo 'Only main remains.'
