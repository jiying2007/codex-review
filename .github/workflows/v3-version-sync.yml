name: Family v3 version sync

on:
  push:
    branches: [feat/family-v3-review]
    paths: [.github/workflows/v3-version-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Synchronize v3 release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const version='3.0.0';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          pkg.version=version;
          lock.version=version;
          lock.packages[''].version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.includes('\n## 3.0.0\n')){
            const notes='\n## 3.0.0\n\n### Changed\n\n- Hard-switched to Codex Safe Core 3.0.1, Policy Schema v3 and Review Receipt v3.\n- Replaced narrative diff truncation with coverage-preserving Review Evidence Chunks.\n- Removed ±3 finding relocation; local findings require exact post-change changed lines.\n- Added canonical deterministic repository review rules and explicit coverage/mechanical evidence.\n';
            c=c.replace('## Unreleased\n','## Unreleased\n'+notes);
            fs.writeFileSync('CHANGELOG.md',c);
          }
          NODE
          npm run verify:lock
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --check
          git commit -m 'chore(release): prepare v3.0.0 metadata'
          git push origin HEAD:feat/family-v3-review
