name: Temporary Core 4.16 Rollout

on:
  push:
    branches: [review-4.9-efficiency-ux]

permissions:
  contents: write

jobs:
  rollout:
    if: ${{ !contains(github.event.head_commit.message, '[core-416-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: review-4.9-efficiency-ux
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          check-latest: false
      - name: Canonical release-bearing repin
        env:
          CORE_SHA: 786e3a3fc896e0e623af6fe63dbf814ddd09bad8
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          git -C src/codex-safe-core fetch --depth=1 origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          node src/codex-safe-core/scripts/repin-consumer.js . "$CORE_SHA"
          npm version 4.9.0 --no-git-tag-version
          node - <<'NODE'
          const fs=require('fs');
          const p='product-contract.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.productVersion='4.9.0';
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          const ch='CHANGELOG.md';
          if(fs.existsSync(ch)){
            let s=fs.readFileSync(ch,'utf8');
            s=s.replace(/^## 4\.8\.1\b/m,'## 4.9.0');
            fs.writeFileSync(ch,s);
          }
          NODE
          # This GitHub Actions token cannot update workflow files. Preserve the
          # old reusable-guard pin here; the connected GitHub writer applies the
          # exact canonical guard change separately after this generated commit.
          git checkout -- .github/workflows/family-release-guard.yml
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'canonical repin produced no changes' >&2; exit 2; }
          git commit -m '[core-416-generated] chore(release): Review 4.9.0 pins Core 4.16.0'
          git push origin HEAD:review-4.9-efficiency-ux
