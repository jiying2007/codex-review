name: Family docs hard cut
on:
  push:
    branches: [family/judgment-lifecycle-v1]
permissions:
  contents: write
jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: family/judgment-lifecycle-v1, fetch-depth: 0 }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - name: Remove retired Review product facts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const oldSha='cd9788f1280a217fbe6d0beb59682a85a8b82c4d',newSha='8375907712db37492aff1ac0d0013e2753b1f6ab';
          function walk(dir,out=[]){for(const e of fs.readdirSync(dir,{withFileTypes:true})){if(e.name==='.git'||e.name==='node_modules'||e.name==='src')continue;const p=path.join(dir,e.name);if(e.isDirectory())walk(p,out);else if(e.name.endsWith('.md')&&e.name!=='CHANGELOG.md')out.push(p);}return out;}
          for(const file of walk('.')){
            let s=fs.readFileSync(file,'utf8');
            s=s.split(oldSha).join(newSha).replace(/Safe Core 4\.10\.2/g,'Safe Core 4.11.0').replace(/Core 4\.10\.2/g,'Core 4.11.0').replace(/Review Receipt v4/g,'Review Receipt v5');
            s=s.replace(/Fresh and independent review/g,'Fresh review and bounded replay').replace(/Fresh 与 Independent Review/g,'Fresh Review 与有界 Replay');
            s=s.replace(/^.*Independent Review Staged Changes.*\n?/gmi,'').replace(/^.*独立复审 Staged Changes.*\n?/gmi,'');
            s=s.replace(/independent re-review/gi,'fresh blind re-review').replace(/independent reviewers/gi,'fresh blind reviewers').replace(/independent reviewer/gi,'fresh blind reviewer').replace(/Independent Review/gi,'fresh blind review');
            fs.writeFileSync(file,s);
          }
          let v=fs.readFileSync('scripts/verify-product-docs.js','utf8');
          v=v.replace('assert.match(docs, /Review Receipt v4/);','assert.match(docs, /Review Receipt v5/);');
          v=v.replace("assert.doesNotMatch(readmes, /Safe Core v[123]\\b|Review Receipt v[123]\\b/);","assert.doesNotMatch(readmes, /Safe Core v[123]\\b|Review Receipt v[1234]\\b|Independent Review Staged Changes|独立复审 Staged Changes/);");
          fs.writeFileSync('scripts/verify-product-docs.js',v);
          NODE
          rm .github/workflows/family-docs-hardcut.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(review): hard-cut retired Review 4.4 semantics'
          git push origin HEAD:family/judgment-lifecycle-v1
