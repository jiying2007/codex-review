name: Family v3 exact-line finalizer

on:
  push:
    branches: [feat/family-v3-review]
    paths: [.github/workflows/v3-exact-line-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Remove nearest-line compatibility residue
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'extension.js';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('  nearestChangedLine,\n', '');
          s = s.replace("    const exactChangedLine = lineInChangedRanges(finding.line, ranges);\n    const nearestLine = nearestChangedLine(finding.line, ranges);", "    const exactChangedLine = lineInChangedRanges(finding.line, ranges);");
          s = s.replace("    else if (!exactChangedLine && nearestLine === undefined) meta.reason = 'line_not_mappable';", "    else if (!exactChangedLine) meta.reason = 'line_not_mappable';");
          s = s.replace('    const lineNumber = exactChangedLine ? finding.line : nearestLine;', '    const lineNumber = finding.line;');
          s = s.replace("    const locationNote = exactChangedLine ? '' : `\\n\\n${t('Location note: the model line was outside the changed lines and was mapped to the nearest changed line {0}.', lineNumber)}`;\n", '');
          s = s.replace("      ? `${finding.title}\\n\\n${finding.description}\\n\\n${t('Suggestion:')} ${finding.suggestion}${locationNote}`\n      : `${finding.title}\\n\\n${finding.description}${locationNote}`;", "      ? `${finding.title}\\n\\n${finding.description}\\n\\n${t('Suggestion:')} ${finding.suggestion}`\n      : `${finding.title}\\n\\n${finding.description}`;");
          s = s.replace("    meta.reason = exactChangedLine ? 'exact' : 'nearest_changed_line';", "    meta.reason = 'exact';");
          for (const forbidden of ['nearestChangedLine', 'nearest_changed_line', 'mapped to the nearest changed line']) {
            if (s.includes(forbidden)) throw new Error(`residual remains: ${forbidden}`);
          }
          fs.writeFileSync(p, s);
          NODE
          git rm .github/workflows/v3-exact-line-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension.js
          git commit -m 'fix!: enforce exact changed-line publication only'
          git push origin HEAD:feat/family-v3-review
