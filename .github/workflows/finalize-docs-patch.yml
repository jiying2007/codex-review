name: Finalize docs patch
on:
  push:
    branches: [release-v4.3.1-docs]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22'
          cache: npm
      - name: Prepare v4.3.1
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const version='4.3.1';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          pkg.version=version;
          lock.version=version;
          lock.packages[''].version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.includes(`## ${version}`)) changelog=changelog.replace('## Unreleased\n\n',`## Unreleased\n\n## ${version} - 2026-08-28\n\n- Publish the complete bilingual OpenAI-compatible relay setup and troubleshooting guide; runtime, Safe Contract, Core pin and provider behavior are unchanged.\n\n`);
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run package
      - name: Commit final release candidate
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-docs-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md .github/workflows/finalize-docs-patch.yml
          git diff --cached --check
          git commit -m 'chore(release): prepare v4.3.1'
          git push origin HEAD:release-v4.3.1-docs
