name: Temporary Review 4.8 Model Routing Finalizer

on:
  push:
    branches: ["feat/model-routing-v1-runtime"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/model-routing-v1-runtime
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
      - name: Apply deterministic Review 4.8 routing migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          # Runtime policy: machine registry + explicit user selection policy.
          replace_once('src/policy.js',
            "const { resolveCodexRuntime, inspectCodexRuntime } = require('./codex-safe-core/codex-runtime-resolver');\n",
            "const { resolveCodexRuntime, inspectCodexRuntime } = require('./codex-safe-core/codex-runtime-resolver');\nconst { resolveModelRegistry } = require('./codex-safe-core/model-registry-resolver');\n")
          replace_once('src/policy.js',
            "  const profile = resolveReviewModeProfile(mode, profilePack);\n",
            "  const profile = resolveReviewModeProfile(mode, profilePack);\n\n  const modelSelectionStrategy = String(getUserOnlySetting(config, 'modelSelectionStrategy', 'auto') || 'auto').trim();\n  if (!['auto','preference','fixed'].includes(modelSelectionStrategy)) throw new Error('User-level safeCodexReview.modelSelectionStrategy is invalid.');\n  const modelCompatibilityPolicy = String(getUserOnlySetting(config, 'modelCompatibilityPolicy', modelSelectionStrategy === 'fixed' ? 'warn' : 'strict') || 'strict').trim();\n  if (!['strict','warn','permissive'].includes(modelCompatibilityPolicy)) throw new Error('User-level safeCodexReview.modelCompatibilityPolicy is invalid.');\n  const rawCandidates = getUserOnlySetting(config, 'modelCandidates', []);\n  if (!Array.isArray(rawCandidates) || rawCandidates.length > 8) throw new Error('User-level safeCodexReview.modelCandidates is invalid.');\n  const modelCandidates = Object.freeze(rawCandidates.map((raw,index) => {\n    const text=String(raw||'').trim(), slash=text.indexOf('/');\n    if (slash <= 0 || slash === text.length-1 || text.length > 384 || /[\\r\\n\\0]/.test(text)) throw new Error(`User-level safeCodexReview.modelCandidates[${index}] is invalid.`);\n    return Object.freeze({ provider:text.slice(0,slash), model:text.slice(slash+1) });\n  }));\n  const modelRegistryResolution = resolveModelRegistry();\n")
          replace_once('src/policy.js',
            "    fastModel,\n    codexRuntime,\n",
            "    fastModel,\n    modelSelectionStrategy,\n    modelCompatibilityPolicy,\n    modelCandidates,\n    modelRegistry: modelRegistryResolution.registry,\n    modelRegistrySource: modelRegistryResolution.source,\n    modelRegistryPath: modelRegistryResolution.configPath,\n    codexRuntime,\n")
          replace_once('src/policy.js',
            "    reviewProfile: `${options.mode}/${options.profilePack}`,\n",
            "    reviewProfile: `${options.mode}/${options.profilePack}`,\n    modelRouting: `${options.modelSelectionStrategy}/${options.modelCompatibilityPolicy}/${options.modelRegistry?.revision || 'unmanaged'}`,\n")

          # Runtime routing: managed registry uses role-aware Core routing; no registry remains explicit unmanaged CLI mode.
          replace_once('src/codex.js',
            "  usageShape, usageAdd, estimateRequestTokens, scoreEvidenceRisk, selectModel, selectChunksWithinByteBudget\n",
            "  usageShape, usageAdd, estimateRequestTokens, scoreEvidenceRisk, selectModel, selectChunksWithinByteBudget\n")
          replace_once('src/codex.js',
            "const { resolveReviewProfile, validatePatchProposal } = require('./codex-safe-core/quality-platform');\n",
            "const { resolveReviewProfile, validatePatchProposal } = require('./codex-safe-core/quality-platform');\nconst { resolveModelSelection, buildModelEvidence } = require('./codex-safe-core/model-routing');\n")
          marker="function operationTimeout(options){return Math.max(10000,Number(options?.codexRuntime?.timeouts?.operationMs)||600000);}\n"
          routing="""function runtimeProviderId(options){return String(options?.codexRuntimeInspection?.providerId||options?.codexRuntime?.provider?.mode||'').trim();}\nfunction resolveManagedModel(options,{role='reviewer',mode=options?.mode||'balanced',explicitModel=''}={}){\n  if(!options?.modelRegistry)return Object.freeze({managed:false,role,model:String(explicitModel||'').trim(),selection:null});\n  const provider=runtimeProviderId(options),strategy=String(options.modelSelectionStrategy||'auto');\n  const request={registry:options.modelRegistry,role,mode,strategy,provider,compatibilityPolicy:options.modelCompatibilityPolicy|| (strategy==='fixed'?'warn':'strict'),crossProvider:false};\n  if(strategy==='fixed'){request.model=String(explicitModel||'').trim();request.fixed={provider,model:request.model};}\n  else if(strategy==='preference')request.candidates=options.modelCandidates||[];\n  const selection=resolveModelSelection(request);\n  return Object.freeze({managed:true,role,model:selection.resolvedModel,selection});\n}\nfunction resolveHypothesisRoute(options,riskScore){\n  if(!options?.modelRegistry){const model=selectModel({model:options?.model,fastModel:options?.fastModel,riskScore});return Object.freeze({managed:false,role:model&&model===options?.fastModel&&Number(riskScore)<4?'scout':'reviewer',model,selection:null});}\n  if(Number(riskScore)<4){try{return resolveManagedModel(options,{role:'scout',mode:'fast',explicitModel:options.fastModel||options.model});}catch(error){if(error?.code!=='MODEL_UNAVAILABLE')throw error;}}\n  return resolveManagedModel(options,{role:'reviewer',mode:options.mode||'balanced',explicitModel:options.model});\n}\nfunction modelEvidenceFor(route,usage){return route?.selection?buildModelEvidence(route.selection,{usage,routingPolicyRevision:'review-4.8.0-v1',lineagePinned:false}):null;}\n"""
          replace_once('src/codex.js',marker,routing+marker)
          replace_once('src/codex.js',
            "  let estimatedTokens=0,resolvedVersion='not-run',modelHypothesisCount=0,processedChunks=0;\n",
            "  let estimatedTokens=0,resolvedVersion='not-run',modelHypothesisCount=0,processedChunks=0;\n  const modelEvidence=[];\n")
          replace_once('src/codex.js',
            "    const riskScore=scoreEvidenceRisk({paths:chunk.paths,text:chunk.text}),model=selectModel({model:options.model,fastModel:options.fastModel,riskScore});\n",
            "    const riskScore=scoreEvidenceRisk({paths:chunk.paths,text:chunk.text}),route=resolveHypothesisRoute(options,riskScore),model=route.model;\n")
          replace_once('src/codex.js',
            "    estimatedTokens+=result.requestEstimate?.totalTokens||estimate.totalTokens;usageAdd(usage,result.usage);resolvedVersion=result.resolved.version||resolvedVersion;models.add(model||'cli-default');\n",
            "    estimatedTokens+=result.requestEstimate?.totalTokens||estimate.totalTokens;usageAdd(usage,result.usage);resolvedVersion=result.resolved.version||resolvedVersion;models.add(model||'cli-default');{const evidenceItem=modelEvidenceFor(route,result.usage);if(evidenceItem)modelEvidence.push(evidenceItem);}\n")
          replace_once('src/codex.js',
            "      const result=await sharedCodexCli.runStructuredCodex({codexPath:options.codexPath,model:options.model,runtime:options.codexRuntime,phase:'verification',",
            "      const verificationRoute=resolveManagedModel(options,{role:'reviewer',mode:options.mode||'balanced',explicitModel:options.model});\n      const result=await sharedCodexCli.runStructuredCodex({codexPath:options.codexPath,model:verificationRoute.model,runtime:options.codexRuntime,phase:'verification',")
          replace_once('src/codex.js',
            "      estimatedTokens+=result.requestEstimate?.totalTokens||estimate.totalTokens;usageAdd(usage,result.usage);resolvedVersion=result.resolved.version||resolvedVersion;models.add(options.model||'cli-default');verifierCalled=true;\n",
            "      estimatedTokens+=result.requestEstimate?.totalTokens||estimate.totalTokens;usageAdd(usage,result.usage);resolvedVersion=result.resolved.version||resolvedVersion;models.add(verificationRoute.model||'cli-default');{const evidenceItem=modelEvidenceFor(verificationRoute,result.usage);if(evidenceItem)modelEvidence.push(evidenceItem);}verifierCalled=true;\n")
          replace_once('src/codex.js',
            "    tokenBudget,estimatedTokens,usage,evidenceManifestDigest:semanticEvidence.manifest.manifestDigest,\n",
            "    tokenBudget,estimatedTokens,usage,evidenceManifestDigest:semanticEvidence.manifest.manifestDigest,\n    modelRoutingContractVersion:1,modelRoutingManaged:Boolean(options.modelRegistry),modelRegistrySource:options.modelRegistrySource||'none',modelRegistryRevision:options.modelRegistry?.revision||'',modelEvidence:Object.freeze(modelEvidence),\n")
          replace_once('src/codex.js',
            "  const result=await sharedCodexCli.runStructuredCodex({codexPath:options.codexPath,model:options.model,runtime:options.codexRuntime,phase:'patch-proposal',",
            "  const route=resolveManagedModel(options,{role:'reviewer',mode:options.mode||'balanced',explicitModel:options.model});\n  const result=await sharedCodexCli.runStructuredCodex({codexPath:options.codexPath,model:route.model,runtime:options.codexRuntime,phase:'patch-proposal',")
          replace_once('src/codex.js',
            "  return {...validatePatchProposal(result.parsed,{allowedPaths:stagedPaths,maxBytes:256*1024}),usage:result.usage,durationMs:result.durationMs};\n",
            "  return {...validatePatchProposal(result.parsed,{allowedPaths:stagedPaths,maxBytes:256*1024}),usage:result.usage,durationMs:result.durationMs,modelEvidence:modelEvidenceFor(route,result.usage)};\n")

          # Manifest settings and release identity.
          pkg=Path('package.json'); data=json.loads(pkg.read_text()); data['version']='4.8.0'; props=data['contributes']['configuration']['properties']
          props['safeCodexReview.modelSelectionStrategy']={'type':'string','enum':['auto','preference','fixed'],'default':'auto','scope':'application','description':'Model Routing Contract v1 selection strategy. Auto uses approved machine-registry models; preference uses only the ordered modelCandidates list; fixed requires an explicit model.'}
          props['safeCodexReview.modelCandidates']={'type':'array','items':{'type':'string','minLength':3,'maxLength':384},'maxItems':8,'default':[],'scope':'application','description':'Ordered provider/model candidates for preference routing. Repository policy cannot set this machine/user-owned routing input.'}
          props['safeCodexReview.modelCompatibilityPolicy']={'type':'string','enum':['strict','warn','permissive'],'default':'strict','scope':'application','description':'Compatibility handling for Model Routing Contract v1. Auto/preference should normally remain strict.'}
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          lock=Path('package-lock.json'); ld=json.loads(lock.read_text()); ld['version']='4.8.0'; ld['packages']['']['version']='4.8.0'; lock.write_text(json.dumps(ld,ensure_ascii=False,indent=2)+'\n')
          pc=Path('product-contract.json'); pd=json.loads(pc.read_text()); pd['productVersion']='4.8.0'; pc.write_text(json.dumps(pd,ensure_ascii=False,indent=2)+'\n')
          ch=Path('CHANGELOG.md'); ct=ch.read_text(); heading='## 4.8.0 - 2026-09-04\n\n- Consume Core Model Routing Contract v1 at runtime: approved machine Registry Auto routing, explicit Fixed/Preference strategies, low-risk Scout with reviewer escalation, Reviewer-only semantic verification, and per-call Model Evidence.\n- Preserve unmanaged Codex CLI/default behavior only when no machine Registry exists; never synthesize an approved model or silently cross providers.\n- Bind routing strategy/registry revision into policy identity so routing changes invalidate stale replay identity.\n\n';
          if '## 4.8.0 - 2026-09-04' not in ct: ch.write_text(ct.replace('## 4.7.5 - 2026-09-04\n',heading+'## 4.7.5 - 2026-09-04\n',1))
          tq=Path('test/quality-platform.test.js'); tt=tq.read_text(); anchor="assert.strictEqual(pkg.contributes.configuration.properties['safeCodexReview.profilePack'].default,'general');\n"; extra="assert.strictEqual(pkg.contributes.configuration.properties['safeCodexReview.modelSelectionStrategy'].default,'auto');\nassert.strictEqual(pkg.contributes.configuration.properties['safeCodexReview.modelCompatibilityPolicy'].default,'strict');\nassert.ok(!('safeCodexReview.crossProvider' in pkg.contributes.configuration.properties));\nassert.match(codex,/resolveModelSelection/); assert.match(codex,/buildModelEvidence/);\n";
          if extra not in tt:
              if anchor not in tt: raise SystemExit('missing quality-platform settings anchor')
              tq.write_text(tt.replace(anchor,anchor+extra,1))
          PY
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A -- ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(review): consume Model Routing Contract v1 at runtime'
            git push origin HEAD:feat/model-routing-v1-runtime
          fi
