name: Prepare release v4.0.2
on:
  push:
    branches: [release-v4.0.2]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Bump release identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          npm version 4.0.2 --no-git-tag-version
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: release v4.0.2'
          git push origin HEAD:release-v4.0.2
