name: Prepare Review v4.3.2 once

on:
  push:
    branches: [release-v4.3.2-core-v4.8.1]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Prepare non-workflow maintenance patch
        shell: bash
        run: |
          set -euo pipefail
          old='b71e11ef3eafba5aa4359376c79a792a05ee85eb'
          new='d06383ecf58b8153ddbd9d0b26a4f83b6e0515c2'
          sed -i "s/${old}/${new}/g" .codex-safe.example.json scripts/release.test.js
          git update-index --add --cacheinfo 160000,${new},src/codex-safe-core
          node <<'NODE'
          const fs=require('fs');
          for (const name of ['package.json','package-lock.json']) {
            const x=JSON.parse(fs.readFileSync(name,'utf8'));
            x.version='4.3.2';
            if (x.packages?.['']) x.packages[''].version='4.3.2';
            fs.writeFileSync(name,JSON.stringify(x,null,2)+'\n');
          }
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          const marker='## Unreleased\n';
          const note='\n## 4.3.2 - 2026-08-30\n\n- Repin to immutable Codex Safe Core v4.8.1 (`d06383ecf58b8153ddbd9d0b26a4f83b6e0515c2`) after the Family workspace/test-stability maintenance line; preserve Review runtime behavior, Safe Contract v2, Policy Schema v3, Review Receipt v4 and Review Prompt Contract v1.\n';
          if (!c.includes('## 4.3.2 - 2026-08-30')) c=c.replace(marker,marker+note);
          fs.writeFileSync('CHANGELOG.md',c);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .codex-safe.example.json scripts/release.test.js package.json package-lock.json CHANGELOG.md
          git diff --cached --check
          git commit -m 'chore(release): prepare Review v4.3.2 on Core v4.8.1'
          git push origin HEAD:release-v4.3.2-core-v4.8.1
