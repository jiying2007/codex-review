name: Apply Family maintenance migration

on:
  push:
    branches: [family-maintenance-2026-08-23]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '22' }
      - name: Apply maintenance release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node <<'NODE'
          const fs=require('fs');
          for (const file of ['package.json','package-lock.json']) {
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.version='4.0.1';
            if (file==='package-lock.json' && data.packages?.['']) data.packages[''].version='4.0.1';
            fs.writeFileSync(file, JSON.stringify(data,null,2)+'\n');
          }
          NODE
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text()
          entry='## 4.0.1\n\n### Changed\n\n- Repin to Safe Core 4.0.1 maintenance release and align immutable provenance attestation with `actions/attest-build-provenance` v4.2.2.\n\n'
          if '## Unreleased\n' in s: s=s.replace('## Unreleased\n','## Unreleased\n\n'+entry,1)
          else: s=s.replace('# Changelog\n','# Changelog\n\n'+entry,1)
          p.write_text(s)
          PY
          old=0f67c3f4856b2e3261c31976d6725780e5e4c373
          new=4d101475d8b20a2381f78447822ac1eab6504dd8
          while IFS= read -r -d '' f; do sed -i "s/${old}/${new}/g; s/# v4\.1\.1/# v4.2.2/g" "$f"; done < <(git grep -lz "$old" || true)
          git -C src/codex-safe-core fetch origin 270fe1e5740f837a2359e50c0d943be8e7b3926d
          git -C src/codex-safe-core checkout 270fe1e5740f837a2359e50c0d943be8e7b3926d
          rm .github/workflows/family-maintenance-migrate.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore: align Family maintenance baseline'
          git push origin HEAD:family-maintenance-2026-08-23
