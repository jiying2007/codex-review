name: Dispatch Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dispatch.yml']

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Remove dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-dispatch.yml
          git commit -m 'ci: remove one-time release dispatcher'
          git push origin HEAD:main
      - name: Dispatch permanent Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" -f ref=main
