name: Finalize 2.1
on:
  push:
    paths: ['.github/workflows/finalize-2.1.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  statuses: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Prepare release and self-delete
        shell: bash
        run: |
          set -euo pipefail
          npm run release:prepare -- 2.1.0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml'); s=p.read_text()
          if 'workflow_dispatch:' not in s.split('permissions:',1)[0]: s=s.replace('  pull_request:\n','  pull_request:\n  workflow_dispatch:\n',1)
          p.write_text(s)
          PY
          rm -f .github/workflows/finalize-2.1.yml
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration
      - run: xvfb-run -a npm run test:trust
      - run: npm run package
      - name: Commit validated 2.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release!: Codex Review Safe 2.1.0'
          git push origin HEAD:main
      - name: Dispatch and verify permanent CI and Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref main
          gh workflow run release.yml --ref main
          wait_run(){
            local wf="$1" id=''
            for _ in $(seq 1 30); do
              id=$(gh run list --workflow "$wf" --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$head\") | .databaseId" | head -n1)
              [ -n "$id" ] && { echo "$id"; return 0; }
              sleep 2
            done
            return 1
          }
          ci=$(wait_run ci.yml); rel=$(wait_run release.yml)
          verify(){
            local id="$1" context="$2" state=success
            gh run watch "$id" --exit-status || state=failure
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head}" -f state="$state" -f context="$context" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null
            [ "$state" = success ]
          }
          verify "$ci" 'ci-2.1-final'
          verify "$rel" 'release-2.1-final'
