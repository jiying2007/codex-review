name: One-time Review support refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply terminal Review boundary
        shell: bash
        env:
          CORE_SHA: 31614537a25f67e329f88269ed7756b3c02ef687
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'extension.js': [("./src/core", "./src/review-support")],
              'src/git.js': [("./core", "./review-support")],
              'src/review.js': [("./core", "./review-support")],
              'src/receipts.js': [("./core", "./review-support")],
              'test.js': [("./src/core", "./src/review-support")],
              'package.json': [("src/core.js", "src/review-support.js")],
              'scripts/build.js': [("'core.js'", "'review-support.js'")],
              'scripts/verify-module-boundaries.js': [
                  ("'./src/core'", "'./src/review-support'"),
                  ("src/core.js", "src/review-support.js")
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'expected replacement did not change {name}')
              path.write_text(text)

          boundary = Path('scripts/verify-module-boundaries.js')
          text = boundary.read_text()
          marker = "assert.strictEqual(fs.existsSync('src/safe-contract.js'), false, 'legacy src/safe-contract.js shim must not return');"
          insert = "assert.strictEqual(fs.existsSync('src/core.js'), false, 'ambiguous Review src/core.js must not return');\n"
          if insert.strip() not in text:
              text = text.replace(marker, insert + marker)
          boundary.write_text(text)
          PY
          rm -f src/core.js
          git update-index --add --cacheinfo 160000,$CORE_SHA,src/codex-safe-core
          rm -f .github/workflows/review-support-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor!: remove ambiguous Review core boundary'
          git push origin HEAD:main
