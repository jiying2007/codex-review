name: Apply terminal hardening once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'terminal-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: terminal-hardening
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply terminal hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .terminal-hardening-00 .terminal-hardening-01 .terminal-hardening-02 \
            | base64 --decode | gzip -dc > /tmp/terminal-hardening.py
          python3 /tmp/terminal-hardening.py
          rm -f .terminal-hardening-00 .terminal-hardening-01 .terminal-hardening-02 TERMINAL_RETRY
          sed -i '1{/^\\$/d;}' scripts/verify-lock.js
          sed -i '1{/^\\$/d;}' scripts/verify-l10n.js
          node --check extension.js
          node --check scripts/verify-lock.js
          node --check scripts/verify-l10n.js
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run package
      - name: Commit hardened terminal baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close terminal compatibility gaps"
          git push origin HEAD:terminal-hardening
