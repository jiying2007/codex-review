name: Family governance bootstrap
on:
  push:
    branches: [family-governance-v4.2.0]
permissions:
  contents: write
jobs:
  adopt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Pin exact Core v4.2.0 gitlink
        env:
          CORE_SHA: a0c3419684f835108cad31eb909b3d7f7df7b260
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C src/codex-safe-core fetch origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          git add src/codex-safe-core
          git diff --cached --quiet && exit 0
          git commit -m 'chore: pin Codex Safe Core v4.2.0'
          git push origin HEAD:family-governance-v4.2.0
