name: Finalize provider runtime
on:
  push:
    branches: [runtime-provider-v4.3.0]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Finalize and validate
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ada3733a0d938b763fd241628da86990af7cfad7
          OLD_CORE_SHA: 23830be910c2b313d7679ee2c938cb94a1478b7f
        run: |
          set -euo pipefail
          git init .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_REF_NAME}" --depth=1
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          git submodule update --init --recursive
          git -C src/codex-safe-core fetch origin "${CORE_SHA}" --depth=1
          git -C src/codex-safe-core checkout --detach "${CORE_SHA}"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          core=os.environ['CORE_SHA']; old_core=os.environ['OLD_CORE_SHA']
          p=Path('package.json'); data=json.loads(p.read_text()); data['version']='4.3.0'
          props=data['contributes']['configuration']['properties']
          runtime_props={
            'safeCodexReview.providerMode': {'type':'string','enum':['openai','openai-compatible'],'default':'openai','scope':'application','description':'Codex provider runtime: built-in OpenAI or an explicitly configured OpenAI-compatible Responses endpoint.'},
            'safeCodexReview.providerBaseUrl': {'type':'string','default':'','scope':'application','description':'HTTPS base URL for openai-compatible mode. User Codex config.toml is intentionally ignored.'},
            'safeCodexReview.providerApiKeyEnv': {'type':'string','default':'OPENAI_API_KEY','scope':'application','description':'Environment-variable name containing the provider API key. The secret value is never stored in VS Code settings.'},
            'safeCodexReview.connectTimeoutSeconds': {'type':'number','default':15,'minimum':1,'maximum':120,'scope':'application','description':'Provider connection timeout in seconds.'},
            'safeCodexReview.requestTimeoutSeconds': {'type':'number','default':180,'minimum':10,'maximum':900,'scope':'application','description':'Maximum time for one Codex model request.'},
            'safeCodexReview.reviewTimeoutSeconds': {'type':'number','default':600,'minimum':30,'maximum':1800,'scope':'application','description':'Whole Review operation deadline across hypothesis and verification requests.'},
            'safeCodexReview.streamIdleTimeoutSeconds': {'type':'number','default':60,'minimum':5,'maximum':600,'scope':'application','description':'Maximum idle time for a provider response stream.'}
          }
          rebuilt={}
          for k,v in props.items():
            if k=='safeCodexReview.timeoutSeconds': continue
            rebuilt[k]=v
            if k=='safeCodexReview.model': rebuilt.update(runtime_props)
          data['contributes']['configuration']['properties']=rebuilt
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('extension.js'); s=p.read_text()
          old='''  resolveCodexExecutable,\n  probeCodexCapabilities,\n  runCodexReview,'''; new='''  resolveCodexExecutable,\n  probeCodexCapabilities,\n  probeCodexRuntime,\n  runCodexReview,'''
          if 'probeCodexRuntime,' not in s:
            if old not in s: raise SystemExit('extension import anchor missing')
            s=s.replace(old,new,1)
          old='''  const resolved = await resolveCodexExecutable(options.codexPath);\n  await probeCodexCapabilities(resolved, options.model);\n  const { stdout: gitVersion } = await runProcess('git', ['--version'], { timeoutMs: 10000, prepared: false });\n  vscode.window.showInformationMessage(t('Codex Review Safe environment is ready: {0}; {1}; required CLI capabilities OK', resolved.version || resolved.executable, gitVersion.trim()));'''
          new='''  const runtime = await probeCodexRuntime({ codexPath: options.codexPath, model: options.model, runtime: options.codexRuntime });\n  const { stdout: gitVersion } = await runProcess('git', ['--version'], { timeoutMs: 10000, prepared: false });\n  const endpoint = runtime.provider.endpointHost || 'Codex default';\n  vscode.window.showInformationMessage(t('Codex Review Safe environment is ready: {0}; {1}; provider {2} ({3}); live structured probe {4} ms', runtime.codexVersion || options.codexPath, gitVersion.trim(), runtime.provider.mode, endpoint, runtime.durationMs));'''
          if 'live structured probe {4} ms' not in s:
            if old not in s: raise SystemExit('checkEnvironment anchor missing')
            s=s.replace(old,new,1)
          old='''function friendlyError(error) {\n  const detail = error?.stderr || error?.message || String(error);\n  if (error?.code === 'ETIMEDOUT') return t('{0}. Increase safeCodexReview.timeoutSeconds, or check Codex network/login status.', detail);\n  return detail;\n}'''
          new='''function friendlyError(error) {\n  const detail = error?.message || error?.stderr || String(error);\n  const provider = error?.provider;\n  const meta = provider ? ` Provider: ${provider.mode}${provider.endpointHost ? ` @ ${provider.endpointHost}` : ''}.` : '';\n  const timing = Number.isFinite(error?.elapsedMs) ? ` Elapsed: ${Math.round(error.elapsedMs / 100) / 10}s${Number.isFinite(error?.lastActivityMs) ? `; last activity ${Math.round(error.lastActivityMs / 100) / 10}s ago` : ''}.` : '';\n  const diagnostic = error?.diagnosticTail ? ` Diagnostic: ${String(error.diagnosticTail).slice(-1200)}` : '';\n  if (String(error?.code || '').startsWith('ECODEX_')) return `${detail}${meta}${timing}${diagnostic}`;\n  return detail;\n}'''
          if 'const provider = error?.provider;' not in s:
            if old not in s: raise SystemExit('friendlyError anchor missing')
            s=s.replace(old,new,1)
          p.write_text(s)
          key='Codex Review Safe environment is ready: {0}; {1}; provider {2} ({3}); live structured probe {4} ms'
          for name,value in [('l10n/bundle.l10n.json',key),('l10n/bundle.l10n.zh-cn.json','Codex Review Safe 环境正常：{0}；{1}；Provider {2}（{3}）；真实结构化探测 {4} ms')]:
            p=Path(name); doc=json.loads(p.read_text()); doc[key]=value; p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          for name,heading,text in [
            ('README.md','## Codex provider runtime','Codex Review Safe intentionally ignores `~/.codex/config.toml` to preserve the Safe Contract. For an OpenAI-compatible relay, set `safeCodexReview.providerMode` to `openai-compatible`, configure `safeCodexReview.providerBaseUrl`, and set `safeCodexReview.providerApiKeyEnv` to the name of an environment variable visible to the VS Code process. Compatible providers use Responses HTTP/SSE rather than WebSocket. `Check Environment` now performs a live structured provider probe.\n'),
            ('README.zh-CN.md','## Codex Provider Runtime','Codex Review Safe 为保持 Safe Contract 会主动忽略 `~/.codex/config.toml`。使用 OpenAI-compatible 中转站时，将 `safeCodexReview.providerMode` 设为 `openai-compatible`，配置 `safeCodexReview.providerBaseUrl`，并让 `safeCodexReview.providerApiKeyEnv` 指向 VS Code 进程可见的 API Key 环境变量。兼容 Provider 固定使用 Responses HTTP/SSE，不走 WebSocket。`Check Environment` 现在会真实执行一次结构化 Provider 探测。\n')]:
            p=Path(name); x=p.read_text()
            if heading not in x: p.write_text(x.rstrip()+f'\n\n{heading}\n\n{text}')
          p=Path('CHANGELOG.md'); x=p.read_text(); marker='# Changelog\n'; entry='\n## 4.3.0 - 2026-08-28\n\n- Add the shared Core v4.6 Codex Runtime/Provider Contract with explicit OpenAI-compatible relay configuration while preserving `--ignore-user-config`.\n- Split per-request and whole-review timeouts, force relay traffic to Responses HTTP/SSE, add live Environment Check, and surface provider/DNS/TLS/auth/rate-limit/model/timeout diagnostics without exposing secrets.\n'
          if '## 4.3.0 - 2026-08-28' not in x: p.write_text(x.replace(marker,marker+entry,1))
          for name in ['scripts/release.test.js','.codex-safe.example.json']:
            p=Path(name); x=p.read_text()
            if old_core in x: p.write_text(x.replace(old_core,core))
            elif core not in x: raise SystemExit(f'Core provenance missing in {name}')
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add -A
          git diff --cached --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run package
          rm .github/workflows/finalize-runtime-provider.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: add shared Codex provider runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
