name: One-shot manual Marketplace version finalizer

on:
  push:
    branches: [governance/manual-marketplace-4.8.2]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[manual-marketplace-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/manual-marketplace-4.8.2
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '24.19.0'
      - name: Apply version and contract patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const oldVersion='4.8.1', nextVersion='4.8.2';
          const readJson=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const writeJson=(f,v)=>fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n');
          const pkg=readJson('package.json');
          if(pkg.version!==oldVersion) throw new Error(`package version drift: ${pkg.version}`);
          pkg.version=nextVersion; writeJson('package.json',pkg);
          const lock=readJson('package-lock.json');
          if(lock.version!==oldVersion||lock.packages?.['']?.version!==oldVersion) throw new Error('package-lock version drift');
          lock.version=nextVersion; lock.packages[''].version=nextVersion; writeJson('package-lock.json',lock);
          const contract=readJson('product-contract.json');
          if(contract.productVersion!==oldVersion) throw new Error(`product contract drift: ${contract.productVersion}`);
          contract.productVersion=nextVersion; writeJson('product-contract.json',contract);
          const changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(changelog.startsWith(`## ${nextVersion}\n`)) throw new Error('changelog already updated');
          fs.writeFileSync('CHANGELOG.md',`## ${nextVersion}\n\n- Make VS Code Marketplace publication manual-only for the current stage; immutable GitHub Release remains the required Family distribution authority, while manual Marketplace publication keeps exact-release verification and receipt generation when explicitly invoked.\n\n${changelog}`);
          NODE
          git diff --check
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),c=require('./product-contract.json'); if(p.version!=='4.8.2'||l.version!=='4.8.2'||l.packages[''].version!=='4.8.2'||c.productVersion!=='4.8.2') process.exit(1)"
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add package.json package-lock.json product-contract.json CHANGELOG.md
          git commit -m '[manual-marketplace-generated] chore(review): stage 4.8.2 governance release'
          git push origin HEAD:governance/manual-marketplace-4.8.2
