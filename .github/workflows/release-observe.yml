name: Observe Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-observe.yml']

permissions:
  contents: write
  actions: write
  statuses: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Remove observer and resolve final main SHA
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-observe.yml
          git commit -m 'ci: remove one-time release observer'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch and observe permanent release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        shell: bash
        run: |
          set -uo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" -f ref=main
          run_id=''
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow release.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"${FINAL_SHA}\") | .databaseId" | head -n1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          if [ -z "$run_id" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -f state=failure -f context=release-v2 -f description='release dispatch was not observed' >/dev/null
            exit 1
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          if gh run watch "$run_id" --exit-status; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -f state=success -f context=release-v2 -f description="release run ${run_id} passed" -f target_url="$url" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" -f state=failure -f context=release-v2 -f description="release run ${run_id} failed" -f target_url="$url" >/dev/null
            exit 1
          fi
