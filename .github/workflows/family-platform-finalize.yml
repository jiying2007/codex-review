name: Finalize Review Quality Platform once

on:
  push:
    branches: [family-platform-v4.4.0]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: family-platform-v4.4.0
          submodules: recursive
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply remaining wiring and exact Core pin
        shell: bash
        run: |
          set -euo pipefail
          core_sha='c59a036cdb0b5839fe0e794031d38fd274bc116b'
          git -C src/codex-safe-core fetch --quiet origin "$core_sha"
          git -C src/codex-safe-core checkout --quiet "$core_sha"
          git add src/codex-safe-core
          python3 scripts/finalize-family-platform.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm scripts/finalize-family-platform.py
      - name: Run full Review CI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 >/dev/null 2>&1 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 >/dev/null 2>&1
          xvfb-run -a npm run ci
      - name: Commit validated non-workflow state
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .github/workflows/family-release-guard.yml .github/workflows/family-platform-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete Review Quality Platform 4.1'
          git push origin HEAD:family-platform-v4.4.0
