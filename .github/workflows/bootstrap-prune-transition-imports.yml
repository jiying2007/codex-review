name: Bootstrap dead transition import cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Prune imports left by removed private test surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('extension.js')
          text = p.read_text()
          replacements = [
            ("const {\n  PROJECT_RULES_FILE,\n  normalizeFsPath,\n  normalizeGitPathForComparison,\n  clampNumber,\n  validateExtraInstructions,\n  getUserOnlySetting\n} = require('./src/core');",
             "const {\n  PROJECT_RULES_FILE,\n  normalizeFsPath,\n  normalizeGitPathForComparison\n} = require('./src/core');"),
            ("const {\n  prepareCommand,\n  runProcess\n} = require('./src/process');",
             "const { runProcess } = require('./src/process');"),
            ("const {\n  git,\n  getGitApi,\n  getRepositories,\n  chooseRepository,\n  getStagedDiff,\n  getIndexFingerprint,\n  getHeadOid,\n  getRepositorySnapshot,\n  snapshotsEqual,\n  getDirtyOpenPathSet,\n  parseNameStatusZ,\n  getStagedChangeMetadata,\n  getBinaryPathSet,\n  getSubmodulePathSet,\n  getUnmergedPaths,\n  getUnstagedPathSet\n} = require('./src/git');",
             "const {\n  getGitApi,\n  getRepositories,\n  chooseRepository,\n  getStagedDiff,\n  getHeadOid,\n  getRepositorySnapshot,\n  snapshotsEqual,\n  getDirtyOpenPathSet,\n  getStagedChangeMetadata,\n  getBinaryPathSet,\n  getSubmodulePathSet,\n  getUnmergedPaths,\n  getUnstagedPathSet\n} = require('./src/git');"),
            ("const {\n  readProjectRulesAtHead,\n  getEffectiveOptions\n} = require('./src/policy');",
             "const { getEffectiveOptions } = require('./src/policy');"),
            ("const {\n  computeVerdict,\n  parseChangedLineRanges,\n  lineInChangedRanges,\n  nearestChangedLine,\n  outputSchema,\n  buildPrompt,\n  parseCodexJsonl,\n  normalizeFinding,\n  validateReviewResult,\n  buildReviewInputMeta,\n  createReviewReceipt,\n  shortFingerprint,\n  severityPasses\n} = require('./src/review');",
             "const {\n  parseChangedLineRanges,\n  lineInChangedRanges,\n  nearestChangedLine,\n  buildReviewInputMeta,\n  createReviewReceipt,\n  severityPasses\n} = require('./src/review');"),
            ("const {\n  resolveCodexExecutable,\n  probeCodexCapabilities,\n  buildCodexArgs,\n  runCodexReview,\n  isCliCompatibilityError\n} = require('./src/codex');",
             "const {\n  resolveCodexExecutable,\n  probeCodexCapabilities,\n  runCodexReview,\n  isCliCompatibilityError\n} = require('./src/codex');")
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'expected import block not found: {old[:60]}')
            text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check
      - name: Commit runtime-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension.js
          git diff --cached --check
          git commit -m 'refactor: prune dead transition imports'
          git push origin HEAD:${{ github.head_ref }}
