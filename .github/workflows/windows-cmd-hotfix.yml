name: Windows CMD Hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: codex-review-windows-cmd-hotfix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Windows cmd.exe quoting fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path('extension.js')
          s = p.read_text(encoding='utf-8')
          old = "args: ['/d', '/s', '/c', commandLine],"
          new = "args: ['/d', '/s', '/c', `\"${commandLine}\"`],"
          if old not in s:
              raise SystemExit('expected prepareCommand pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          '@ | python -
          node --check extension.js
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Windows Extension Host integration
        run: npm run test:integration
      - name: Commit verified hotfix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/windows-cmd-hotfix.yml
          git add extension.js .github/workflows/windows-cmd-hotfix.yml
          git commit -m "fix: execute Windows Codex command scripts reliably"
          git push origin HEAD:main
