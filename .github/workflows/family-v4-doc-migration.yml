name: Family v4 Documentation Migration
on:
  push:
    branches: [family-terminal-hardening]
    paths: [.github/workflows/family-v4-doc-migration.yml]
permissions: { contents: write }
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: family-terminal-hardening, fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['README.md','README.zh-CN.md','SECURITY.md','PUBLISHING.md']){
            if(!fs.existsSync(file))continue;
            let s=fs.readFileSync(file,'utf8');
            s=s.replaceAll('Codex Safe Core 3.0.1','Codex Safe Core 4.0.0').replaceAll('Safe Core 3.0.1','Safe Core 4.0.0').replaceAll('e6e25b502aa35a079f660346785cf283fe293b6d','4dc4de836625a8b70084531eb3321734eca675d0').replaceAll('Review Receipt v3','Review Receipt v4').replaceAll('Review Receipt V3','Review Receipt V4').replaceAll('Codex Review Safe 3.0','Codex Review Safe 4.0').replaceAll('Family v3','Family v4');
            fs.writeFileSync(file,s);
          }
          NODE
          git rm .github/workflows/family-v4-doc-migration.yml
          git diff --check
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md SECURITY.md PUBLISHING.md 2>/dev/null || true
          git commit -m 'docs: converge Review Safe documentation on Family v4'
          git push origin HEAD:family-terminal-hardening
