name: Bootstrap test-cli lockfile

on:
  push:
    branches:
      - test/workspace-trust-cli
    paths:
      - '.github/workflows/bootstrap-test-cli-lock.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Update package manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact @vscode/test-cli@0.0.15
      - name: Verify bootstrap scope
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          test "$changed" = $'package-lock.json\npackage.json' || {
            echo 'bootstrap changed unexpected files' >&2
            exit 1
          }
      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'test: add vscode test-cli runner'
          git push origin HEAD:test/workspace-trust-cli
