name: Cleanup Review Safe rebrand once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.head_ref == 'cleanup-review-safe-trigger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Remove migration branch and this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete review-safe-rebrand || true
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          git push origin --delete cleanup-review-safe-trigger || true
          git rm .github/workflows/cleanup-review-safe-rebrand.yml
          git commit -m "build: finalize Codex Review Safe rebrand"
          git push origin HEAD:main
