name: Cleanup legacy branches once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.head_ref == 'branch-cleanup-trigger' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Delete obsolete branches and self-clean
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          obsolete=(
            ci-final-validation
            ci-verify-release
            engineering-hardening
            release-bootstrap-trigger
            release-bootstrap-trigger-2
            release-materialize-observable
            release-v1.1-trigger
            runtime-i18n-main-trigger
            runtime-i18n-runner
            runtime-i18n-trigger
          )
          for branch in "${obsolete[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          if git ls-remote --exit-code --heads origin refs/heads/branch-cleanup-trigger >/dev/null 2>&1; then
            git push origin --delete branch-cleanup-trigger || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-legacy-branches.yml
          git commit -m "build: remove one-time branch cleanup workflow"
          git push origin HEAD:main
