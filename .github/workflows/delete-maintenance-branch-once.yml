name: One-shot maintenance branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.branch-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/maintenance-terminal-hardening-2026-08-24"
