name: Fix Marketplace verifier once
on:
  push:
    branches: [marketplace-verifier-final]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/marketplace.yml')
          s=p.read_text()
          s=s.replace('--pattern "$vsix" --pattern SHA256SUMS','--pattern "$vsix" --pattern SBOM.spdx.json --pattern SHA256SUMS')
          s=s.replace('test -f "release-artifacts/$vsix"\n          test -f release-artifacts/SHA256SUMS','test -f "release-artifacts/$vsix"\n          test -f release-artifacts/SBOM.spdx.json\n          test -f release-artifacts/SHA256SUMS')
          p.write_text(s)
          PY
          git add .github/workflows/marketplace.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: verify complete Marketplace release checksum set'
          git push origin HEAD:marketplace-verifier-final
