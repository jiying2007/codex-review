name: Prepare Core v4.9 Consumer Cutover
on:
  push:
    branches: [family-core-v4.9.0]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Prepare Review 4.3.3 on immutable Core 4.9.0
        env:
          CORE_SHA: 10393a0035ce5168b3d0e88822af0d74fe85ec6c
          VERSION: 4.3.3
        shell: bash
        run: |
          set -euo pipefail
          git -C src/codex-safe-core fetch --quiet origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --quiet --detach "$CORE_SHA"
          git add src/codex-safe-core
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs=require('fs');
          const core=require('./src/codex-safe-core/core-contract.json');
          const pkg=require('./package.json');
          const coreSha=process.env.CORE_SHA;
          const replace=(file,pairs)=>{let s=fs.readFileSync(file,'utf8');for(const [a,b] of pairs)s=s.replaceAll(a,b);fs.writeFileSync(file,s);};
          for(const file of ['README.md','README.zh-CN.md','.codex-safe.example.json'])replace(file,[
            ['7ffbf6f1791e17ba74faf0922e7a702bdac72059',coreSha],
            ['d06383ecf58b8153ddbd9d0b26a4f83b6e0515c2',coreSha]
          ]);
          replace('SECURITY.md',[
            ['Codex Review Safe 3.x follows the **Codex Safe Core v3** implementation line','Codex Review Safe follows the **Codex Safe Core v4** implementation line'],
            ['Safe Core v3 parses unified diff hunks','Safe Core v4 parses unified diff hunks']
          ]);
          const contract={
            productContractVersion:core.productContractVersion,
            productId:'codex-review-safe',
            productVersion:pkg.version,
            safeCoreVersion:core.coreVersion,
            safeCoreCommit:coreSha,
            safeCoreMajorVersion:core.safeCoreMajorVersion,
            safeContractVersion:core.safeContractVersion,
            policySchemaVersion:core.policySchemaVersion,
            minimumNodeVersion:core.minimumNodeVersion,
            canonicalNodeVersion:core.canonicalNodeVersion,
            supportedNodeMajors:core.supportedNodeMajors,
            reviewReceiptVersion:core.reviewReceiptVersion,
            reviewPromptContractVersion:core.reviewPromptContractVersion,
            qualityPlatformVersion:core.qualityPlatformVersion
          };
          fs.writeFileSync('product-contract.json',JSON.stringify(contract,null,2)+'\n');
          let vd=fs.readFileSync('scripts/verify-product-docs.js','utf8');
          vd=vd.replace("const path = require('node:path');", "const path = require('node:path');\nconst contract = require('../product-contract.json');");
          vd=vd.replace("assert.match(docs, /7ffbf6f1791e17ba74faf0922e7a702bdac72059/);", "assert.match(docs, new RegExp(contract.safeCoreCommit));");
          fs.writeFileSync('scripts/verify-product-docs.js',vd);
          let sm=fs.readFileSync('scripts/verify-security-manifest.js','utf8');
          sm=sm.replace("require('./verify-product-docs');", "require('../src/codex-safe-core/scripts/verify-consumer-product-contract').verify(root,require('../product-contract.json').safeCoreCommit,'codex-review-safe');\nrequire('./verify-product-docs');");
          fs.writeFileSync('scripts/verify-security-manifest.js',sm);
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          const entry=`## 4.3.3\n\n- Repin to immutable Codex Safe Core v${core.coreVersion} (${coreSha}) and adopt Product Contract v${core.productContractVersion}.\n- Derive current documentation/Core identity checks from machine contracts instead of preserving historical SHA/version literals.\n- No Review runtime authority, Safe Contract, Policy Schema, Receipt, or review semantics change.\n\n`;
          if(!changelog.includes('## 4.3.3')) changelog=changelog.replace(/^#.*\n+/,m=>m+'\n'+entry);
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          node scripts/verify-security-manifest.js
          git add package.json package-lock.json product-contract.json README.md README.zh-CN.md SECURITY.md .codex-safe.example.json scripts/verify-product-docs.js scripts/verify-security-manifest.js CHANGELOG.md src/codex-safe-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(release): prepare Review v4.3.3 on Core v4.9.0'
          git push origin HEAD:family-core-v4.9.0
