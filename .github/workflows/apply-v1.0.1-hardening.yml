name: Apply Codex Review Safe v1.0.1 hardening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'final-hardening-v1.0.1' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: final-hardening-v1.0.1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Apply final hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/final-hardening-v1.0.1.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit hardened branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- extension.js package.json package-lock.json README.md README.zh-CN.md CHANGELOG.md PUBLISHING.md scripts/verify-l10n.js test.js test/integration/runTest.js test/integration/suite/integration.test.js l10n/bundle.l10n.json l10n/bundle.l10n.zh-cn.json
          git add -u -- .github/final-hardening-v1.0.1.py
          git diff --cached --check
          git commit -m 'fix: harden Codex Review Safe 1.0.1 compatibility'
          git push origin HEAD:final-hardening-v1.0.1
