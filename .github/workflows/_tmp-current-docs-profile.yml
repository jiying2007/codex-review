name: Temporary Review Current Contract Repair

on:
  push:
    branches: [feat/model-routing-v1]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/model-routing-v1
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Remove legacy profile surface and align current docs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete pkg.contributes.configuration.properties['safeCodexReview.profile'];
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          let en=fs.readFileSync('README.md','utf8');
          const enAnchor='Working-tree-only edits are intentionally excluded from the reviewed snapshot.\n\n';
          if(!en.includes('## Review mode and engineering profile')) en=en.replace(enAnchor,enAnchor+`## Review mode and engineering profile\n\nExecution depth and engineering emphasis are separate controls:\n\n- \`safeCodexReview.mode\`: \`fast | balanced | deep\`;\n- \`safeCodexReview.profilePack\`: \`general | backend | frontend | security | cpp | embedded-linux | embedded-mcu | driver | kernel | realtime\`;\n- \`safeCodexReview.fastModel\` is optional and may be used only for bounded low-risk hypothesis generation; semantic verification remains on the primary model.\n- \`safeCodexReview.maxTokenBudget\` and \`safeCodexReview.totalContextBudgetBytes\` bound whole-review model consumption. Budget exhaustion is surfaced as a coverage gap, never silently treated as complete coverage.\n\nUse **Fresh Blind Review** when you explicitly require a new model run for the same ReviewSubject; normal Review keeps the bounded replay policy.\n\n`);
          en=en.replace(/\n## Codex provider runtime[\s\S]*?\n## Runtime Contract v3 — zero-config\n\n/, '\n## Runtime / Provider Contract v3 — zero-config\n\n');
          fs.writeFileSync('README.md',en);

          let zh=fs.readFileSync('README.zh-CN.md','utf8');
          const zhAnchor='仅存在于 Working Tree、但没有 Stage 的修改明确排除在本次 Review Snapshot 之外。\n\n';
          if(zh.includes(zhAnchor) && !zh.includes('## Review Mode 与工程 Profile Pack')) zh=zh.replace(zhAnchor,zhAnchor+`## Review Mode 与工程 Profile Pack\n\n执行深度与工程关注面是两个独立控制：\n\n- \`safeCodexReview.mode\`：\`fast | balanced | deep\`；\n- \`safeCodexReview.profilePack\`：\`general | backend | frontend | security | cpp | embedded-linux | embedded-mcu | driver | kernel | realtime\`；\n- \`safeCodexReview.fastModel\` 为可选项，只能用于受限的低风险 hypothesis 生成；语义 verification 始终使用 primary model。\n- \`safeCodexReview.maxTokenBudget\` 与 \`safeCodexReview.totalContextBudgetBytes\` 约束整次 Review 的模型消耗；预算耗尽必须形成 coverage gap，不能静默宣称覆盖完整。\n\n同一 ReviewSubject 明确要求重新执行模型时使用 **Fresh Blind Review**；普通 Review 保持受限 Replay 策略。\n\n`);
          zh=zh.replace(/\n## Codex Provider Runtime[\s\S]*?\n## Runtime Contract v3 — zero-config\n\n/, '\n## Runtime / Provider Contract v3 — zero-config\n\n');
          fs.writeFileSync('README.zh-CN.md',zh);
          NODE
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add package.json README.md README.zh-CN.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore(review): hard-cut legacy profile and align Runtime v3 docs'
          git push origin HEAD:feat/model-routing-v1
