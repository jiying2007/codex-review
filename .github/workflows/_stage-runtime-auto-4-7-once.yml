name: Stage Review Runtime Auto 4.7 Once
on:
  push:
    branches: [feat/runtime-auto-4.7.0]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Patch Remote SSH runtime UX and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('extension.js'); s=p.read_text()
          if 'Extension Host:' not in s:
              pattern=r"async function checkEnvironment\(\) \{.*?\n\}\n\nfunction friendlyError"
              replacement=r'''async function checkEnvironment() {
            assertTrustedWorkspace();
            const repositories = await getRepositories();
            const repoRoot = repositories[0]?.root || vscode.workspace.workspaceFolders?.[0]?.uri.fsPath || process.cwd();
            const headOid = await getHeadOid(repoRoot);
            const options = await getEffectiveOptions(repoRoot, headOid);
            const runtime = await probeCodexRuntime({ codexPath: options.codexPath, model: options.model, runtime: options.codexRuntime });
            const { stdout: gitVersion } = await runProcess('git', ['--version'], { timeoutMs: 10000, prepared: false });
            const inspection = options.codexRuntimeInspection || {};
            const endpoint = runtime.provider.endpointHost || 'Codex default';
            const remoteName = vscode.env.remoteName || '';
            const hostLabel = remoteName ? `Remote (${remoteName})` : 'Local';
            const configLabel = inspection.configPath || 'built-in OpenAI';
            const credentialLabel = runtime.provider.mode === 'openai' ? 'Codex managed auth' : inspection.credentialEnvPresent ? `env:${inspection.credentialEnv}` : inspection.authJsonPresent ? inspection.authJsonPath : `missing (${inspection.credentialEnv || 'provider credential'})`;
            log(`Extension Host: ${hostLabel}`);
            log(`Runtime source: ${inspection.source || 'explicit'}; config=${configLabel}`);
            log(`Provider: ${runtime.provider.mode}; endpoint=${endpoint}; transport=${inspection.transport || 'managed'}`);
            log(`Credential source: ${credentialLabel}`);
            if (inspection.plaintextWarning) log(`WARNING: ${inspection.plaintextWarning}`);
            vscode.window.showInformationMessage(uiText(
              `Codex Review Safe 环境正常：Extension Host ${hostLabel}；Runtime ${inspection.source || 'explicit'}；Provider ${runtime.provider.mode} (${endpoint})；真实结构化探测 ${runtime.durationMs} ms`,
              `Codex Review Safe environment is ready: Extension Host ${hostLabel}; runtime ${inspection.source || 'explicit'}; provider ${runtime.provider.mode} (${endpoint}); live structured probe ${runtime.durationMs} ms`
            ));
          }

          function friendlyError'''
              s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
              if n != 1: raise SystemExit('Review Doctor anchor not found')
              p.write_text(s2)

          t=Path('test.js'); s=t.read_text()
          if 'machineScopedSettings' not in s:
              pattern=r"  assert\.strictEqual\(properties\['safeCodexReview\.codexPath'\]\.scope, 'machine'\);\n  for \(const \[key, value\] of Object\.entries\(properties\)\) \{\n    if \(key === 'safeCodexReview\.codexPath'\) continue;\n    assert\.strictEqual\(value\.scope, 'application', `\$\{key\} must remain application scoped`\);\n  \}"
              replacement="""  const machineScopedSettings = new Set([
            'safeCodexReview.codexPath',
            'safeCodexReview.providerMode',
            'safeCodexReview.providerBaseUrl',
            'safeCodexReview.providerApiKeyEnv',
            'safeCodexReview.providerCredentialSource',
            'safeCodexReview.providerAllowInsecureHttp'
          ]);
          for (const [key, value] of Object.entries(properties)) {
            const expectedScope = machineScopedSettings.has(key) ? 'machine' : 'application';
            assert.strictEqual(value.scope, expectedScope, `${key} must remain ${expectedScope} scoped`);
          }"""
              s2,n=re.subn(pattern,replacement,s,count=1)
              if n != 1: raise SystemExit('Review unit scope regex anchor not found')
              t.write_text(s2)

          Path('test/runtime-auto.test.js').write_text("""'use strict';
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.resolve(__dirname,'..');
          const pkg=JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8'));
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          test('Review defaults to Core Runtime auto discovery with machine-local advanced overrides',()=>{
            const props=pkg.contributes.configuration.properties;
            assert.deepEqual(props['safeCodexReview.providerMode'].enum,['auto','openai','openai-compatible']);
            assert.equal(props['safeCodexReview.providerMode'].default,'auto');
            for(const key of ['providerMode','providerBaseUrl','providerApiKeyEnv','providerCredentialSource','providerAllowInsecureHttp']) assert.equal(props['safeCodexReview.'+key].scope,'machine');
          });
          test('Review delegates provider inheritance to Core Runtime Contract v3',()=>{
            const source=read('src/policy.js');
            assert.match(source,/codex-runtime-resolver/);
            assert.match(source,/resolveCodexRuntime\\(codexRuntimeSelection\\)/);
            assert.match(source,/inspectCodexRuntime\\(codexRuntimeSelection\\)/);
            assert.match(source,/providerMode', 'auto'/);
          });
          test('Review Doctor exposes Remote Extension Host and redacted runtime source',()=>{
            const source=read('extension.js');
            assert.match(source,/vscode\\.env\\.remoteName/);
            assert.match(source,/Extension Host:/);
            assert.match(source,/Credential source:/);
            assert.doesNotMatch(source,/credentialLabel\\s*=.*\\.value/);
          });
          """)

          def append_once(file, marker, block):
              path=Path(file); text=path.read_text()
              if marker not in text: path.write_text(text.rstrip()+"\n\n"+block.strip()+"\n")
          append_once('README.md','Runtime Contract v3 — zero-config',r'''## Runtime Contract v3 — zero-config

          Review defaults to **Auto** runtime discovery. If `codex` already works in the current VS Code Extension Host, Review reuses machine Family Runtime (`~/.codex-safe/runtime.json`) or machine Codex configuration (`${CODEX_HOME}/config.toml` / `~/.codex/config.toml`) without re-entering the relay URL. In Remote SSH the workspace extension runs remotely, so the config and `auth.json` are read from the remote Linux account. Literal private-IP HTTP relays are inherited with a plaintext warning; public/non-IP HTTP remains fail-closed. VS Code provider settings are machine-scoped advanced overrides.''')
          append_once('README.zh-CN.md','Runtime Contract v3 — zero-config',r'''## Runtime Contract v3 — zero-config

          Review 默认使用 **Auto** Runtime。只要当前 VS Code Extension Host 中的 `codex` 已可正常使用，Review 就直接复用机器级 Family Runtime（`~/.codex-safe/runtime.json`）或机器级 Codex 配置（`${CODEX_HOME}/config.toml` / `~/.codex/config.toml`），无需再次填写中转站地址。Remote SSH 下 Workspace Extension 运行在远端，因此读取的是远端 Linux 用户的配置和 `auth.json`。字面量私网 IP HTTP 可继承，但 Doctor 会明确提示明文风险；公网/非 IP HTTP 继续 fail-closed。VS Code Provider 设置仅作为 machine-scope Advanced Override。''')
          ch=Path('CHANGELOG.md'); text=ch.read_text()
          if '## 4.7.0 - 2026-09-02' not in text:
              text=re.sub(r'^# Changelog\s*\n', '# Changelog\n\n## 4.7.0 - 2026-09-02\n\n- Default provider selection to Core Runtime Contract v3 auto discovery so a working machine Codex relay is reused without duplicate Review settings.\n- Make provider overrides machine-scoped for Remote SSH correctness; Doctor reports Extension Host location, runtime source/config path, credential source presence, transport and plaintext HTTP warnings without exposing secrets.\n- Pin immutable Codex Safe Core 4.13.0 exactly and add regression coverage for zero-config runtime behavior.\n\n', text, count=1)
              ch.write_text(text)
          PY
          npm run ci
          if ! git diff --quiet -- extension.js test.js test/runtime-auto.test.js README.md README.zh-CN.md CHANGELOG.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add extension.js test.js test/runtime-auto.test.js README.md README.zh-CN.md CHANGELOG.md
            git commit -m 'feat(runtime): complete Review Remote SSH zero-config UX'
            git push origin HEAD:feat/runtime-auto-4.7.0
          fi
