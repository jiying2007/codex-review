name: Stage Review Runtime Auto 4.7 Once
on:
  push:
    branches: [feat/runtime-auto-4.7.0]
permissions:
  contents: write
jobs:
  patch-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Patch runtime settings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const p=pkg.contributes.configuration.properties;
          const mode=p['safeCodexReview.providerMode'];
          mode.enum=['auto','openai','openai-compatible'];
          mode.default='auto';
          mode.scope='machine';
          mode.description='Runtime selection. Auto (recommended) inherits the machine Family Runtime or Codex CLI provider; other values are advanced machine-local overrides.';
          for(const key of ['providerBaseUrl','providerApiKeyEnv','providerCredentialSource','providerAllowInsecureHttp']) p['safeCodexReview.'+key].scope='machine';
          p['safeCodexReview.providerBaseUrl'].description='Advanced override only: base URL for explicit openai-compatible mode. Auto normally inherits the machine Codex/Family Runtime.';
          p['safeCodexReview.providerApiKeyEnv'].description='Advanced override only: provider credential environment-variable name. Secret values are never stored in settings.';
          p['safeCodexReview.providerCredentialSource'].description='Advanced override only. Auto runtime discovery reuses the machine credential contract.';
          p['safeCodexReview.providerAllowInsecureHttp'].description='Advanced override only. Auto can inherit machine-owned literal private-IP HTTP and surfaces a plaintext warning.';
          const resolverCheck='node --check src/codex-safe-core/codex-runtime-resolver.js';
          if(!pkg.scripts.check.includes(resolverCheck)) pkg.scripts.check=pkg.scripts.check.replace('node --check src/codex-safe-core/codex-cli.js',resolverCheck+' && node --check src/codex-safe-core/codex-cli.js');
          if(!pkg.scripts.check.includes('node test/runtime-auto.test.js')) pkg.scripts.check += ' && node test/runtime-auto.test.js';
          if(!pkg.scripts['test:unit'].includes('node test/runtime-auto.test.js')) pkg.scripts['test:unit'] += ' && node test/runtime-auto.test.js';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          if ! git diff --quiet -- package.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json
            git commit -m 'feat(runtime): default Review provider selection to auto'
            git push origin HEAD:feat/runtime-auto-4.7.0
          fi
