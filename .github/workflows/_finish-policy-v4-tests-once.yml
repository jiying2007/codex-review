name: Finish Policy v4 Tests Once
on:
  push:
    branches: [repin-safe-core-v4.10.1]
    paths: [.github/workflows/_finish-policy-v4-tests-once.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-safe-core-v4.10.1
      - name: Align all Review Policy Schema test identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test.js'); s=p.read_text()
          pairs=[
            ('assert.strictEqual(receipt.policySchemaVersion, 3);','assert.strictEqual(receipt.policySchemaVersion, 4);'),
            ('schemaVersion: 3,','schemaVersion: 4,'),
            ('JSON.stringify({ schemaVersion: 3, review: { severityThreshold: \'critical\' } })','JSON.stringify({ schemaVersion: 4, review: { severityThreshold: \'critical\' } })'),
            ('/schemaVersion must be 3/','/schemaVersion must be 4/')
          ]
          for old,new in pairs:
            assert old in s, old
            s=s.replace(old,new)
          p.write_text(s)
          PY
          git add test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test: finish Review Policy Schema v4 migration'
          git push origin HEAD:repin-safe-core-v4.10.1
