name: Release Integrity

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Verify immutable release and every asset
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')" = true || {
            echo "Published release ${RELEASE_TAG} is not immutable." >&2
            exit 1
          }
          gh release verify "$RELEASE_TAG"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$RELEASE_TAG" --dir "$tmp"
          shopt -s nullglob
          assets=("$tmp"/*)
          ((${#assets[@]} > 0)) || { echo "Release ${RELEASE_TAG} has no assets." >&2; exit 1; }
          for asset in "${assets[@]}"; do
            gh release verify-asset "$RELEASE_TAG" "$asset"
          done
