name: Release Integrity

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  attestations: read

jobs:
  integrity:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    uses: jiying2007/codex-safe-core/.github/workflows/consumer-release-integrity.yml@d8ae46fb84787939f6ecf7632ccf8a52b37188fb
    with:
      expected_sha: ${{ github.event.workflow_run.head_sha }}
      product: codex-review-safe
