name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static / unit / contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  integration-latest:
    name: Extension Host / ${{ matrix.os }} / latest
    needs: static
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure Linux Extension Host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - name: Run Extension Host integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run Extension Host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  integration-minimum:
    name: Extension Host / Ubuntu / VS Code 1.90.0
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCODE_TEST_VERSION: '1.90.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration

  integration-zh-cn:
    name: Extension Host / Ubuntu / zh-CN
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCODE_TEST_LOCALE: zh-cn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration

  integration-trust:
    name: Extension Host / Ubuntu / Workspace Trust
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:trust

  package:
    name: Official VSIX / dist boundary
    needs: [integration-latest, integration-minimum, integration-zh-cn, integration-trust]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package
      - name: Verify VSIX contents
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          vsix="codex-review-safe-${version}.vsix"
          unzip -Z1 "$vsix" > /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.json' /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.json' /tmp/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/README.zh-CN.md' /tmp/vsix-files.txt
          grep -Fx 'extension/images/icon.png' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/extension.js' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/codex-safe.schema.json' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/src/codex.js' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/src/codex-safe-core/safe-contract.js' /tmp/vsix-files.txt
          if grep -E '^extension/(extension\.js|src/|test|scripts|package-lock\.json|\.gitmodules|PUBLISHING\.md|CONTRIBUTING\.md|\.gitignore|\.gitattributes|\.github|\.vscode)' /tmp/vsix-files.txt; then
            echo 'VSIX contains development-only files' >&2
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-safe-${{ github.sha }}
          path: |
            codex-review-safe-*.vsix
            SHA256SUMS
          if-no-files-found: error

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
      - id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
      - if: steps.graph.outputs.enabled != 'true'
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high --omit=dev
          node src/codex-safe-core/scripts/verify-package-licenses.js .

  family-release-guard:
    if: github.event_name == 'pull_request'
    uses: jiying2007/codex-safe-core/.github/workflows/family-release-guard.yml@00403dd14877e978698c63d06f6dbdfe2ba9b8cc
    with:
      product: codex-review-safe
      expected_core_sha: 00403dd14877e978698c63d06f6dbdfe2ba9b8cc

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [static, integration-latest, integration-minimum, integration-zh-cn, integration-trust, package, codeql, dependency-review, family-release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable CI dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const prOnly=new Set(['dependency-review','family-release-guard']);
          const failed=Object.entries(needs).filter(([name,value]) => {
            if (value.result === 'success') return false;
            return !(process.env.EVENT_NAME !== 'pull_request' && prOnly.has(name) && value.result === 'skipped');
          });
          if(failed.length){
            console.error('CI Gate blocked:',failed.map(([k,v])=>k+'='+v.result).join(', '));
            process.exit(1);
          }
          NODE
