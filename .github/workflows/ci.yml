name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static / unit / contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  integration-latest:
    name: Extension Host / ${{ matrix.os }} / latest
    needs: static
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure Linux Extension Host dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - name: Run Extension Host integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run Extension Host integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  integration-minimum:
    name: Extension Host / Ubuntu / VS Code 1.90.0
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCODE_TEST_VERSION: '1.90.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration

  integration-zh-cn:
    name: Extension Host / Ubuntu / zh-CN
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VSCODE_TEST_LOCALE: zh-cn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration

  integration-trust:
    name: Extension Host / Ubuntu / Workspace Trust
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:trust

  package:
    name: Official VSIX / dist boundary
    needs: [integration-latest, integration-minimum, integration-zh-cn, integration-trust]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package
      - name: Verify VSIX contents
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          vsix="codex-review-safe-${version}.vsix"
          unzip -Z1 "$vsix" > /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.json' /tmp/vsix-files.txt
          grep -Fx 'extension/package.nls.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.json' /tmp/vsix-files.txt
          grep -Fx 'extension/l10n/bundle.l10n.zh-cn.json' /tmp/vsix-files.txt
          grep -Fx 'extension/README.zh-CN.md' /tmp/vsix-files.txt
          grep -Fx 'extension/images/icon.png' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/extension.js' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/codex-safe.schema.json' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/src/codex.js' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/src/codex-safe-core/safe-contract.js' /tmp/vsix-files.txt
          if grep -E '^extension/(extension\.js|src/|test|scripts|package-lock\.json|\.gitmodules|PUBLISHING\.md|CONTRIBUTING\.md|\.gitignore|\.gitattributes|\.github|\.vscode)' /tmp/vsix-files.txt; then
            echo 'VSIX contains development-only files' >&2
            exit 1
          fi
          sha256sum "$vsix" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-safe-${{ github.sha }}
          path: |
            codex-review-safe-*.vsix
            SHA256SUMS
          if-no-files-found: error