name: Cleanup Merged Branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged local branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete merged branches that have not advanced
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          default_branch="${{ github.event.repository.default_branch }}"
          deleted=0
          preserved=0

          while IFS=$'\t' read -r branch merged_sha; do
            [[ -n "$branch" && -n "$merged_sha" ]] || continue
            [[ "$branch" != "$default_branch" ]] || continue

            current_sha="$(gh api "repos/${repo}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            [[ -n "$current_sha" ]] || continue

            if [[ "$current_sha" != "$merged_sha" ]]; then
              echo "preserve advanced branch: ${branch} (${current_sha:0:12} != merged ${merged_sha:0:12})"
              preserved=$((preserved + 1))
              continue
            fi

            gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
            echo "deleted merged branch: ${branch} @ ${merged_sha:0:12}"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate "repos/${repo}/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null and .head.repo.full_name == .base.repo.full_name) | [.head.ref, .head.sha] | @tsv' \
              | sort -u
          )

          echo "cleanup complete: deleted=${deleted}, preserved_advanced=${preserved}"
