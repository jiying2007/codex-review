name: Finalize v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-finalize.yml']

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Prepare and commit v2.0.0 atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          npm run release:prepare -- 2.0.0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git rm .github/workflows/v2-finalize.yml
          git commit -m 'chore!: release v2.0.0'
          git push origin HEAD:main
      - name: Dispatch permanent Release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
