name: Refresh engineering lockfile

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'engineering-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: engineering-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run verify:lock
      - name: Commit refreshed lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-engineering-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-engineering-lock.yml
          if git diff --cached --quiet; then
            echo 'No lockfile change required.'
            exit 0
          fi
          git commit -m "build: refresh lockfile"
          git push origin HEAD:engineering-hardening
