name: Temporary stage Review 4.7.2 semantic grep bound fix

on:
  push:
    branches:
      - fix/semantic-grep-output-bound-4.7.2
    paths:
      - .github/workflows/tmp-stage-review-4.7.2.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Apply bounded semantic symbol discovery and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          path=Path('src/semantic-evidence.js')
          text=path.read_text()
          text=text.replace("const MAX_SYMBOL_MATCHES = 96;\n", "const MAX_SYMBOL_MATCHES = 96;\nconst MAX_SYMBOL_FILE_LIST_BYTES = 512 * 1024;\nconst MAX_SYMBOL_CANDIDATE_FILES = 96;\nconst MAX_FILES_PER_BROAD_SYMBOL = 16;\n")
          old='''async function grepIndexSymbols(repoRoot, symbols, token) {
            const unique = [...new Set((symbols || []).filter(Boolean))].slice(0, MAX_SYMBOLS);
            if (!unique.length) return [];
            const matches=[];
            for (let start=0; start<unique.length; start+=16) {
              const batch=unique.slice(start,start+16), args=['grep','--cached','-n','-I','-F'];
              for (const symbol of batch) args.push('-e',symbol);
              args.push('--');
              let stdout='';
              try { stdout=(await git(args,repoRoot,token,{maxStdoutBytes:4*1024*1024,maxStderrBytes:128*1024})).stdout; }
              catch(error) { if(error?.code==='ECANCELLED') throw error; if(Number(error?.code)===1) continue; throw error; }
              for(const raw of stdout.split(/\\r?\\n/).filter(Boolean)) {
                const match=raw.match(/^(.+?):(\\d+):(.*)$/); if(!match) continue;
                const file=normalizeGitPathForComparison(match[1]); if(!TEXT_PATH.test(file)) continue;
                const line=Number(match[2]), text=match[3];
                for(const symbol of batch) if(new RegExp(`\\\\b${String(symbol).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')}\\\\b`).test(text)) matches.push({file,line,text,symbol});
                if(matches.length>=MAX_SYMBOL_MATCHES) return matches;
              }
            }
            return matches;
          }'''
          new='''function exactSymbolRegex(symbol) {
            return new RegExp(`\\\\b${String(symbol).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&')}\\\\b`);
          }
          function parseCandidateFiles(stdout) {
            const files=[];
            for (const raw of String(stdout || '').split('\\0').filter(Boolean)) {
              try {
                const file=safeIndexPath(raw);
                if (TEXT_PATH.test(file)) files.push(file);
              } catch {}
            }
            return [...new Set(files)].sort((a,b)=>a.localeCompare(b));
          }
          async function symbolCandidateGroups(repoRoot, batch, token) {
            if (!batch.length) return [];
            const args=['grep','--cached','-l','-z','-I','-F'];
            for (const symbol of batch) args.push('-e',symbol);
            args.push('--');
            let files;
            try {
              const {stdout}=await git(args,repoRoot,token,{maxStdoutBytes:MAX_SYMBOL_FILE_LIST_BYTES,maxStderrBytes:128*1024});
              files=parseCandidateFiles(stdout);
            } catch(error) {
              if(error?.code==='ECANCELLED') throw error;
              if(Number(error?.code)===1) return [];
              if(error?.code==='EOUTPUTLIMIT') {
                if(batch.length===1) return [];
                const mid=Math.ceil(batch.length/2);
                return [...await symbolCandidateGroups(repoRoot,batch.slice(0,mid),token),...await symbolCandidateGroups(repoRoot,batch.slice(mid),token)];
              }
              throw error;
            }
            if(files.length>MAX_SYMBOL_CANDIDATE_FILES && batch.length>1) {
              const mid=Math.ceil(batch.length/2);
              return [...await symbolCandidateGroups(repoRoot,batch.slice(0,mid),token),...await symbolCandidateGroups(repoRoot,batch.slice(mid),token)];
            }
            const limit=batch.length===1?MAX_FILES_PER_BROAD_SYMBOL:MAX_SYMBOL_CANDIDATE_FILES;
            return [{symbols:batch,files:files.slice(0,limit)}];
          }
          async function grepIndexSymbols(repoRoot, symbols, token) {
            const unique = [...new Set((symbols || []).filter(Boolean))].slice(0, MAX_SYMBOLS);
            if (!unique.length) return [];
            const matches=[], cache=new Map(), regexes=new Map(unique.map(symbol=>[symbol,exactSymbolRegex(symbol)]));
            for (let start=0; start<unique.length; start+=16) {
              const groups=await symbolCandidateGroups(repoRoot,unique.slice(start,start+16),token);
              for(const group of groups) for(const file of group.files) {
                let content=cache.get(file);
                if(content===undefined){content=await readIndexText(repoRoot,file,token);cache.set(file,content);}
                if(content==null) continue;
                const lines=content.split(/\\r?\\n/);
                for(let index=0;index<lines.length;index++) {
                  const lineText=lines[index];
                  for(const symbol of group.symbols) if(regexes.get(symbol).test(lineText)) {
                    matches.push({file,line:index+1,text:lineText,symbol});
                    if(matches.length>=MAX_SYMBOL_MATCHES) return matches;
                  }
                }
              }
            }
            return matches;
          }'''
          if old not in text:
            raise SystemExit('expected grepIndexSymbols block not found')
          text=text.replace(old,new)
          path.write_text(text)

          test=Path('test/semantic-output-bounds.test.js')
          test.write_text(r'''\'use strict\';

const assert=require('assert');
const fs=require('fs');
const os=require('os');
const path=require('path');
const {spawnSync}=require('child_process');
const {collectIndexSymbolEvidence}=require('../src/semantic-evidence');

function runGit(cwd,args,options={}) {
  const result=spawnSync('git',args,{cwd,encoding:'utf8',maxBuffer:32*1024*1024,...options});
  if(result.status!==0) throw new Error(`git ${args.join(' ')} failed: ${result.stderr||result.error||result.status}`);
  return result.stdout||'';
}

(async()=>{
  const repo=fs.mkdtempSync(path.join(os.tmpdir(),'review-semantic-output-'));
  try {
    runGit(repo,['init','-q']);
    const symbol='review_safe_high_fanout_symbol';
    const line=`int ${symbol}(void); /* deterministic high-fanout fixture */\n`;
    fs.writeFileSync(path.join(repo,'huge.c'),line.repeat(90000));
    runGit(repo,['add','huge.c']);
    const legacy=runGit(repo,['grep','--cached','-n','-I','-F','-e',symbol,'--']);
    assert.ok(Buffer.byteLength(legacy,'utf8')>4*1024*1024,'fixture must reproduce >4 MiB legacy git grep stdout');
    const diff=[
      'diff --git a/app.c b/app.c','--- a/app.c','+++ b/app.c','@@ -1,0 +1,1 @@',`+${symbol}();`
    ].join('\n');
    const result=await collectIndexSymbolEvidence(repo,diff,['app.c'],undefined);
    assert.ok(result && Array.isArray(result.blocks),'bounded symbol discovery must complete instead of throwing EOUTPUTLIMIT');
    assert.strictEqual(result.blocks.length,0,'oversized index blobs remain excluded by the 128 KiB evidence-file safety ceiling');
    console.log('Semantic symbol discovery >4 MiB stdout regression passed.');
  } finally {
    fs.rmSync(repo,{recursive:true,force:true});
  }
})().catch(error=>{console.error(error);process.exitCode=1;});
'''.replace("\\'use strict\\';","'use strict';"))

          pkg_path=Path('package.json')
          pkg=json.loads(pkg_path.read_text())
          pkg['version']='4.7.2'
          pkg['scripts']['check']=pkg['scripts']['check'].replace('node test/semantic-platform.test.js &&','node test/semantic-platform.test.js && node test/semantic-output-bounds.test.js &&')
          pkg['scripts']['test:unit']=pkg['scripts']['test:unit'].replace('node test/semantic-platform.test.js &&','node test/semantic-platform.test.js && node test/semantic-output-bounds.test.js &&')
          pkg_path.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')

          lock_path=Path('package-lock.json')
          lock=json.loads(lock_path.read_text())
          lock['version']='4.7.2'
          lock['packages']['']['version']='4.7.2'
          lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          contract_path=Path('product-contract.json')
          contract=json.loads(contract_path.read_text())
          contract['productVersion']='4.7.2'
          contract_path.write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n')

          changelog=Path('CHANGELOG.md')
          changelog.write_text('''## 4.7.2 - 2026-09-03\n\n- Bound index-pinned semantic symbol discovery at the source: enumerate matching files with NUL-safe `git grep -l`, recursively split over-broad symbol batches, cap broad-symbol candidates, and inspect only size-preflighted index blobs.\n- Add a real regression fixture whose legacy `git grep -n` output exceeds 4 MiB, proving Review completes bounded semantic discovery instead of failing with `Child process stdout exceeded the limit (4194304 bytes)`.\n- Preserve Core 4.13.1 structured Codex transcript limits, Review judgment/evidence publication contracts, staged-only authority, and fail-closed evidence validation.\n\n'''+changelog.read_text())
          PY
          node --check src/semantic-evidence.js
          node --check test/semantic-output-bounds.test.js
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
      - name: Commit staged product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/semantic-evidence.js test/semantic-output-bounds.test.js package.json package-lock.json product-contract.json CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix(evidence): bound high-fanout semantic symbol discovery'
          git push origin HEAD:fix/semantic-grep-output-bound-4.7.2
