name: Fix Review v4.3.4 lock once
on:
  push:
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/fix-review-time-v4.3.4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-review-time-v4.3.4
          persist-credentials: true
      - name: Align lock version
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          p.version='4.3.4';
          p.packages[''].version='4.3.4';
          fs.writeFileSync('package-lock.json', JSON.stringify(p,null,2)+'\n');
          NODE
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add package-lock.json
          git commit -m 'chore(review): align v4.3.4 lock metadata'
          git push origin HEAD:fix-review-time-v4.3.4
