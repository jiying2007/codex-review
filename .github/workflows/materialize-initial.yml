name: Materialize Initial Release

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Reconstruct extension source
        shell: bash
        run: |
          cat .bootstrap/extension.js.gz.b64.* | base64 --decode | gzip -dc > extension.js
          node --check extension.js
      - name: Generate real npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Unit and regression checks
        run: npm run check
      - name: Extension Host integration
        run: xvfb-run -a npm run test:integration
      - name: Official VSIX package
        run: npm run package
      - name: Finalize repository
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-initial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: finalize initial release"
          git push origin HEAD:main
      - name: Tag initial release
        shell: bash
        run: |
          git tag -a v1.0.0 -m "Codex Review 1.0.0"
          git push origin v1.0.0
