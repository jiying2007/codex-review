name: Materialize Initial Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: codex-review-initial-materialize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Reconstruct extension source
        shell: bash
        run: |
          cat .bootstrap/extension.js.gz.b64.* | base64 --decode | gzip -dc > extension.js
          node --check extension.js
      - name: Apply final command-completion hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('extension.js')
          s = p.read_text(encoding='utf-8')
          old = """      const action = await vscode.window.showWarningMessage(\n        message,\n        '查看报告',\n        '打开 Problems'\n      );\n      if (action === '查看报告') outputChannel.show(true);\n      if (action === '打开 Problems') {\n        vscode.commands.executeCommand('workbench.actions.view.problems');\n      }\n"""
          new = """      void vscode.window.showWarningMessage(\n        message,\n        '查看报告',\n        '打开 Problems'\n      ).then(action => {\n        if (action === '查看报告') outputChannel.show(true);\n        if (action === '打开 Problems') {\n          void vscode.commands.executeCommand('workbench.actions.view.problems');\n        }\n      }, error => {\n        log(`warning notification failed: ${error?.message || error}`);\n      });\n"""
          if old not in s:
              raise SystemExit('expected showWarningMessage block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          node --check extension.js
      - name: Generate real npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Unit and regression checks
        run: npm run check
      - name: Extension Host integration
        run: xvfb-run -a npm run test:integration
      - name: Official VSIX package
        run: npm run package
      - name: Generate SHA256
        shell: bash
        run: sha256sum *.vsix > SHA256SUMS.txt
      - name: Finalize repository
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-initial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: finalize initial release"
          git push origin HEAD:main
      - name: Create initial GitHub Release
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          gh release create v1.0.0 *.vsix SHA256SUMS.txt \
            --target "$COMMIT" \
            --title "Codex Review v1.0.0" \
            --generate-notes
