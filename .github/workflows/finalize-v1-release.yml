name: Finalize v1.0.0 Release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: codex-review-finalize-v1-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate initial release metadata
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          test "$(node -p "require('./package.json').publisher")" = "jiying2007"
          test -f package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Official VSIX package
        run: npm run package
      - name: Generate SHA256
        shell: bash
        run: sha256sum *.vsix > SHA256SUMS.txt
      - name: Remove one-time release workflow from repository
        shell: bash
        run: |
          rm -f .github/workflows/finalize-v1-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-v1-release.yml
          git commit -m "build: finalize v1.0.0 release"
          git push origin HEAD:main
      - name: Recreate v1.0.0 tag and GitHub Release at final main
        shell: bash
        run: |
          FINAL_COMMIT="$(git rev-parse HEAD)"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release delete v1.0.0 --cleanup-tag --yes
          else
            git push origin :refs/tags/v1.0.0 || true
          fi
          git tag -d v1.0.0 >/dev/null 2>&1 || true
          git tag -a v1.0.0 "$FINAL_COMMIT" -m "Codex Review v1.0.0"
          git push origin v1.0.0
          gh release create v1.0.0 *.vsix SHA256SUMS.txt \
            --title "Codex Review v1.0.0" \
            --notes "Initial release of Codex Review for VS Code. Reviews staged Git changes with the local Codex CLI and publishes conservatively validated findings to VS Code Problems."
          gh release view v1.0.0 --json tagName,targetCommitish,url,assets
