name: Normalize Review lock once

on:
  push:
    branches: [maintenance-security-product-2026-08-23]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance-security-product-2026-08-23
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalized lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-lock-once.yml
          git add package-lock.json .github/workflows/normalize-lock-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: normalize Review 4.0.1 lock metadata'
          git push origin HEAD:maintenance-security-product-2026-08-23
