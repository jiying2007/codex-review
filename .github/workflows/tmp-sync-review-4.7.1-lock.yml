name: Temporary Review 4.7.1 lock sync

on:
  push:
    branches: [fix/review-4.7.1-core-4.13.1]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Synchronize lock metadata and remove temporary workflow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
          lock.version = '4.7.1';
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package metadata is missing');
          lock.packages[''].version = '4.7.1';
          fs.writeFileSync(file, JSON.stringify(lock, null, 2) + '\n');
          NODE
          git rm .github/workflows/tmp-sync-review-4.7.1-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          git commit -m 'chore(release): sync Review 4.7.1 lockfile'
          git push origin HEAD:fix/review-4.7.1-core-4.13.1
