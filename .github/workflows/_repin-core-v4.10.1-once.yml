name: Repin Core 4.10.1 Once
on:
  push:
    branches: [repin-safe-core-v4.10.1]
    paths: [.github/workflows/_repin-core-v4.10.1-once.yml]
permissions:
  contents: write
jobs:
  repin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repin-safe-core-v4.10.1
      - name: Repin non-workflow files and exact gitlink
        shell: bash
        env:
          OLD_SHA: 57440a00030941020d5c3e9e01ced3c06062f42e
          NEW_SHA: 76418b80533c644e3ab01045290cd3cdd355622c
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const oldSha=process.env.OLD_SHA,newSha=process.env.NEW_SHA;
          let out=''; try{out=cp.execFileSync('git',['grep','-lz',oldSha],{encoding:'utf8'});}catch(e){if(e.status!==1)throw e;}
          for(const p of out.split('\0').filter(Boolean)){if(p.startsWith('.github/workflows/'))continue;const b=fs.readFileSync(p);if(b.includes(0))continue;let s=b.toString('utf8').replaceAll(oldSha,newSha);s=s.replaceAll('Codex Safe Core 4.10.0','Codex Safe Core 4.10.1').replaceAll('Safe Core 4.10.0','Safe Core 4.10.1');fs.writeFileSync(p,s);}
          const p='product-contract.json',c=JSON.parse(fs.readFileSync(p,'utf8'));c.safeCoreVersion='4.10.1';c.safeCoreCommit=newSha;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          git add -A ':!.github/workflows'
          git update-index --add --cacheinfo 160000,$NEW_SHA,src/codex-safe-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: pin Safe Core 4.10.1'
          git push origin HEAD:repin-safe-core-v4.10.1
