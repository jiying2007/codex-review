name: Temporary sync Review 4.7.2 release identity

on:
  push:
    branches:
      - fix/semantic-grep-output-bound-4.7.2

permissions:
  contents: write

jobs:
  sync:
    if: startsWith(github.event.head_commit.message, 'chore(stage): sync Review 4.7.2')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Sync version, contract, test entry and changelog
        shell: bash
        run: |
          set -euo pipefail
          npm version 4.7.2 --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const key of ['check','test:unit']) {
            const marker='node test/semantic-platform.test.js &&';
            if(!pkg.scripts[key].includes('node test/semantic-output-bounds.test.js')) pkg.scripts[key]=pkg.scripts[key].replace(marker,`${marker} node test/semantic-output-bounds.test.js &&`);
          }
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('product-contract.json','utf8'));
          contract.productVersion='4.7.2';
          fs.writeFileSync('product-contract.json',JSON.stringify(contract,null,2)+'\n');
          NODE
          {
            cat <<'EOF'
          ## 4.7.2 - 2026-09-03

          - Bound index-pinned semantic symbol discovery at the source: enumerate matching files with NUL-safe `git grep -l`, recursively split over-broad symbol batches, cap broad-symbol candidates, and inspect only size-preflighted index blobs.
          - Add a real regression fixture whose legacy `git grep -n` output exceeds 4 MiB, proving Review completes bounded semantic discovery instead of failing with `Child process stdout exceeded the limit (4194304 bytes)`.
          - Preserve Core 4.13.1 structured Codex transcript limits, Review judgment/evidence publication contracts, staged-only authority, and fail-closed evidence validation.

          EOF
            cat CHANGELOG.md
          } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md
      - name: Verify full product gates
        shell: bash
        run: |
          set -euo pipefail
          node --check src/semantic-evidence.js
          node --check test/semantic-output-bounds.test.js
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/semantic-evidence.js test/semantic-output-bounds.test.js package.json package-lock.json product-contract.json CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix(evidence): Review 4.7.2 bounds semantic grep output'
          git push origin HEAD:fix/semantic-grep-output-bound-4.7.2
