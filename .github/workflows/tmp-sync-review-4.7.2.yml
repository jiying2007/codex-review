name: Temporary Review 4.7.2 sync
# rerun-after-vscode-stub
on:
  push:
    branches:
      - fix/semantic-grep-output-bound-4.7.2
    paths:
      - .github/workflows/tmp-sync-review-4.7.2.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm version 4.7.2 --no-git-tag-version --ignore-scripts
      - run: node scripts/tmp-sync-review-4.7.2.js
      - run: node --check src/semantic-evidence.js && node --check test/semantic-output-bounds.test.js && npm ci --ignore-scripts --no-audit --no-fund && npm run ci
      - run: git config user.name automation && git config user.email automation@localhost && git add src/semantic-evidence.js test/semantic-output-bounds.test.js package.json package-lock.json product-contract.json CHANGELOG.md && git diff --cached --check && git commit -m review-4.7.2-semantic-output-bound && git push origin HEAD:fix/semantic-grep-output-bound-4.7.2
