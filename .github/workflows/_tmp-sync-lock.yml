name: Temporary Lock Identity Sync

on:
  push:
    branches: [feat/model-routing-v1]

permissions:
  contents: write

concurrency:
  group: tmp-review-lock-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/model-routing-v1
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Synchronize lock identity only and remove helper
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version=pkg.version;
          if(!lock.packages || !lock.packages['']) throw new Error('package-lock root package is missing');
          lock.packages[''].version=pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock,null,2)+'\n');
          NODE
          git rm .github/workflows/_tmp-sync-lock.yml
          git config user.name 'codex-safe-family-bot'
          git config user.email 'codex-safe-family-bot@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          git commit -m 'chore(review): synchronize 4.7.5 lock identity'
          git push origin HEAD:feat/model-routing-v1
