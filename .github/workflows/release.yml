name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22.22.2'
          cache: npm
      - id: version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package version must be MAJOR.MINOR.PATCH: $version" >&2; exit 1; }
          tag="v${version}"
          previous_version=""
          if [[ "$GITHUB_EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$GITHUB_EVENT_BEFORE" =~ ^0+$ ]]; then
            previous_version=$(git show "${GITHUB_EVENT_BEFORE}:package.json" 2>/dev/null | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})" || true)
          fi
          publish=true
          if [[ "$previous_version" == "$version" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then publish=false; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm run verify:lock
      - if: steps.version.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.version.outputs.publish == 'true'
        run: npm run check

  integration:
    name: Release Extension Host / ${{ matrix.os }}
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - if: runner.os != 'Linux'
        run: npm run test:integration

  integration-minimum:
    name: Release Extension Host / VS Code 1.90.0
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { VSCODE_TEST_VERSION: '1.90.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration

  integration-zh-cn:
    name: Release Extension Host / zh-CN
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { VSCODE_TEST_LOCALE: 'zh-cn' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:integration

  integration-trust:
    name: Release Extension Host / Workspace Trust
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && (sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2)
      - run: xvfb-run -a npm run test:trust

  release:
    name: Package / attest / publish
    needs: [validate, integration, integration-minimum, integration-zh-cn, integration-trust]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with: { node-version: '22.22.2', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run package
      - name: Verify package, generate SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          vsix="codex-review-safe-${version}.vsix"
          unzip -Z1 "$vsix" > /tmp/vsix-files.txt
          grep -Fx 'extension/dist/extension.js' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/codex-safe.schema.json' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/src/codex.js' /tmp/vsix-files.txt
          grep -Fx 'extension/dist/src/codex-safe-core/context-builder.js' /tmp/vsix-files.txt
          if grep -E '^extension/(extension\.js|src/|test|scripts|package-lock\.json|\.gitmodules|PUBLISHING\.md|CONTRIBUTING\.md|\.gitignore|\.gitattributes)' /tmp/vsix-files.txt; then echo 'VSIX contains development-only files' >&2; exit 1; fi
          npm sbom --sbom-format spdx > SBOM.spdx.json
          test -s SBOM.spdx.json
          sha256sum "$vsix" SBOM.spdx.json > SHA256SUMS
      - name: Attest immutable release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            codex-review-safe-${{ needs.validate.outputs.version }}.vsix
            SBOM.spdx.json
            SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-safe-${{ needs.validate.outputs.version }}
          path: |
            codex-review-safe-${{ needs.validate.outputs.version }}.vsix
            SBOM.spdx.json
            SHA256SUMS
          if-no-files-found: error
      - name: Ensure immutable release tag
        env: { GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.validate.outputs.tag }}' }
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Publish immutable GitHub Release
        env: { GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.validate.outputs.tag }}' }
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          vsix="codex-review-safe-${version}.vsix"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets will not be overwritten." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$vsix" SBOM.spdx.json SHA256SUMS --title "Codex Review Safe ${version}" --generate-notes --verify-tag
