name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require lockfile
        shell: bash
        run: test -f package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Extension Host integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Extension Host integration (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve tag and verify package version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          [[ "$TAG" == v* ]] || { echo "Release tag must start with v"; exit 1; }
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" == "$PACKAGE_VERSION" ]] || {
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Generate SHA256
        shell: bash
        run: sha256sum *.vsix > SHA256SUMS.txt
      - name: Create GitHub Release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" *.vsix SHA256SUMS.txt \
              --title "Codex Review $TAG" \
              --generate-notes
          fi
